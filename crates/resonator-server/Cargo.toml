[package]
name = "resonator-server"
description = "Wave server core: SQLite storage, wavelet containers and accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "resonator_server"

# The plain wave server without robots, agents or the web client; the
# full product is the `resonator` binary of crates/resonator.
[[bin]]
name = "resonator-server"
path = "src/main.rs"

[features]
default = ["apps"]
# Wave apps (wasmtime); still off at run time unless `[apps] enabled`.
apps = ["dep:resonator-apps"]

[dependencies]
resonator-model = { path = "../resonator-model" }
resonator-apps = { path = "../resonator-apps", optional = true }
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
resonator-apps = { path = "../resonator-apps" }
zip = { version = "2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
tokio-tungstenite = "0.29"
