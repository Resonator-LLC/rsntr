[package]
name = "resonator-node"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[features]
# Forwarded, so an embedder can reach the optional pieces of the crates
# below without depending on them directly. Both on by default, so
# building this crate is unchanged; `default-features = false` gives a
# node with no gossip ALPN and no scripting engine, which is a materially
# smaller binary.
default = ["gossip", "script"]
gossip = ["resonator-transport/gossip"]
script = ["resonator-authenticator/script"]

[dependencies]
resonator-protocol = { path = "../protocol" }
resonator-transport = { path = "../transport", default-features = false }
resonator-sparql = { path = "../sparql" }
resonator-authenticator = { path = "../authenticator", default-features = false }
rusqlite = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
