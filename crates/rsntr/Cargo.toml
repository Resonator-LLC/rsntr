[package]
name = "rsntr"
description = "Resonator from the terminal: read and write waves on any Resonator server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# A client only: it speaks HTTP to a server (sign-in, then MCP with a
# token) and depends on no other crate of this workspace, so it builds on
# every platform, Windows included.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
# The end-to-end test runs a real server in-process.
resonator-agents = { path = "../resonator-agents" }
resonator-server = { path = "../resonator-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
