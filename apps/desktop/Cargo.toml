[package]
name = "resonator-desktop"
description = "The Resonator app for macOS, Windows and Linux: a window on a node of its own"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Resonator LLC"]
repository = "https://github.com/Resonator-LLC/rsntr"
homepage = "https://rsntr.net"
publish = false

# Its own workspace: Tauri needs a system WebView (WebKitGTK on Linux), which
# the main workspace's builds and tests should not.
[workspace]

[[bin]]
name = "resonator-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gethostname = "1"
resonator-ffi = { path = "../../crates/resonator-ffi" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
lto = "thin"
strip = true
