/* ---- deep links ----------------------------------------------------- */
function parseRoute() {
  var m = location.pathname.match(/^\/o\/([^/]+)\/(proj|holo)(?:\/(.+?))?\/?$/);
  if (!m) return null;
  try {
    return { peer: decodeURIComponent(m[1]), view: m[2], arg: m[3] ? decodeURIComponent(m[3]) : null };
  } catch (e) { return null; }
}
function resolveRoutePeer(peer) {
  if (peer === "local") return "";
  if (/^[0-9a-f]{64}$/.test(peer)) return peer;
  var known = state.ct.contacts.find(function (c) { return c.kind === "peer" && c.label === peer; });
  return known ? known.scope : null;
}
function openRoute(r) {
  var peer = resolveRoutePeer(r.peer);
  if (peer === null || (r.view === "holo" && !r.arg)) {
    addFeed({ kind: "system", text: "link does not resolve: " + location.pathname });
    return;
  }
  state.nav.tab = "peers";
  popToRoot("peers");
  if (peer !== "") pushScreen({ t: "profile", peer: peer });
  if (r.view === "holo") {
    pushScreen({ t: "app", peer: peer, pt: { kind: "hologram", mod: r.arg, signal: "hologram", label: r.arg } });
  } else if (r.arg || peer === "") {
    pushScreen({ t: "proj", peer: peer, path: r.arg || "", label: r.arg || "projection" });
  }
}
function routePathFor() {
  var top = topScreen();
  if (!top) return "/";
  var peerSeg = function (p) { return p === "" ? "local" : p; };
  if (top.t === "app" && top.pt && top.pt.mod) {
    return "/o/" + encodeURIComponent(peerSeg(top.peer)) + "/holo/" + encodeURIComponent(top.pt.mod);
  }
  if (top.t === "proj") {
    return "/o/" + encodeURIComponent(peerSeg(top.peer)) + "/proj" +
      (top.path ? "/" + encodeURIComponent(top.path) : "");
  }
  return "/";
}
function syncUrl() {
  /* inert until start(): rewriting the URL before auth would destroy
     the deep-link path and the token fragment */
  if (!state.booted) return;
  var p = routePathFor();
  if (location.pathname !== p) history.replaceState(null, "", p);
}
function copyLinkTo(btn) {
  copyText(location.origin + routePathFor(), "link copied (token not included)");
}

    rows.forEach(function (c) {

          esc(c.host ? labelFor(c.host) : "[unknown]") + "</span>";
        when = last ? fmtAgo(last) : "";
      } else {

        var seen = p && p.reachable ? "reachable now"
          : (p && p.row && p.row.last_seen ? "last seen " + fmtAgo(p.row.last_seen)
             : (last ? "last message " + fmtAgo(last) : "last seen [never]"));
        meta = presenceBadge(c.scope) + '<span class="snip">' + esc(seen) + "</span>";
        when = last ? fmtAgo(last) : "";

      var isHex = /^[0-9a-f]{60,}/.test(c.label);

  openSheet('<h3>Add peer</h3>' +
    '<button class="bigbtn solid" id="add-scan">scan their qr code</button>' +
    '<div class="mini-note" style="padding-top:2px">a scanned ticket carries id + addresses; the peer is added instantly, nothing to confirm.</div>' +
    '<div class="pt-form" style="padding-bottom:16px">' +
    '<label class="f"><span class="n">or paste a ticket / 64-hex endpoint id</span>' +
    '<input id="add-target" placeholder="endpoint… or 64-hex id" autocomplete="off" spellcheck="false"></label>' +
    '<label class="f"><span class="n">petname (yours only, optional)</span>' +
    '<input id="add-name" placeholder="how you will call them" autocomplete="off"></label>' +
    '<button class="pt-run" id="add-go">add peer</button>' +
    '<div class="mini-note" style="padding:10px 0 0">to be scanned yourself: Qualia &gt; pairing qr</div></div>');
  $("add-scan").onclick = openScanSheet;
  $("add-go").onclick = function () {
    var t = $("add-target").value.trim();
    var n = $("add-name").value.trim();
    if (!t) { toast("paste a ticket or an endpoint id first"); return; }
    addPeerTarget(t, n || null);
  };
}
async function addPeerTarget(target, name) {
  try {
    var j = await apiJson("/api/peer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(name ? { target: target, name: name } : { target: target })
    });
    if (!j.ok) { toast(fmtJsonErr(j).text); return; }
    closeSheet();
    toast("peer added: " + shortHex(j.endpoint_id));
    await loadContacts();
    probePeer(j.endpoint_id, true);
    gotoProfile(j.endpoint_id);
    /* adding lets this node dial them; the knock asks them to admit us,
       so their views and streams open without a CLI round-trip */
    knockAndReport(j.endpoint_id, function () {
      allScreens().forEach(function (sc) {
        if (sc.t === "profile" && sc.peer === j.endpoint_id && sc.fetch) {
          sc.points = null; sc.pointsErr = null; sc.rerender(); sc.fetch();
        }
      });
    });
  } catch (e) {
    if (e.message !== "unauthorized") toast("add failed: " + e.message);
  }
}
function stopScan() {
  if (!state.scan) return;
  clearInterval(state.scan.timer);
  if (state.scan.stream) state.scan.stream.getTracks().forEach(function (t) { t.stop(); });
  state.scan = null;
}
async function openScanSheet() {
  openSheet('<h3>Scan pairing qr</h3>' +
    '<div class="qrbox"><video id="scan-video" autoplay playsinline muted></video>' +
    '<div class="qrnote" id="scan-note">point at the other node\'s pairing qr</div></div>');
  if (typeof BarcodeDetector === "undefined") {
    $("scan-note").textContent = "this browser has no barcode scanner; paste the ticket instead";
    return;
  }
  var stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    var note = $("scan-note");
    if (note) note.textContent = "camera unavailable (" + e.message + "); paste the ticket instead";
    return;
  }
  var video = $("scan-video");
  if (!video) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
  video.srcObject = stream;
  var det = new BarcodeDetector({ formats: ["qr_code"] });
  var busy = false;
  state.scan = { stream: stream, timer: setInterval(async function () {
    if (busy || !state.scan) return;
    busy = true;
    try {
      var codes = await det.detect(video);
      if (codes.length && codes[0].rawValue) {
        var ticket = codes[0].rawValue.trim();
        stopScan();
        addPeerTarget(ticket, null);
      }
    } catch (e) { /* detector not ready yet */ }
    busy = false;
  }, 350) };
}

/* ---- peer profile ---------------------------------------------------- */
function buildProfileScreen(sc) {
  var peer = sc.peer;
  sc.points = null;
  sc.pointsErr = null;
  sc.rerender = function () {
    var c = contactFor(peer);
    var p = state.presence.get(peer);
    var row = p && p.row;
    var hello = p && p.hello;
    var isHex = /^[0-9a-f]{60,}/.test(c.label);
    var name = isHex ? null : c.label;
    var el = sc.el;
    var h = navBarHtml(name || shortHex(peer),
      p ? (p.probing ? "checking…" : (p.reachable ? "reachable now" : "unreachable")) : "");
    h += '<div class="phead">' + avatar(peer, true) +
      '<div class="phead-main"><h2>' + (name ? esc(name) : '<span class="hexname">[no petname]</span>') + "</h2>" +
      '<div class="sub">' + esc(shortHex(peer)) +
      (hello && hello.hint ? ' · "' + esc(hello.hint) + '"' : "") + "</div>" +
      '<div class="badges">' + presenceBadge(peer) +
      '<span class="badge b-plain">' +
      esc(row && row.last_seen ? "seen " + fmtAgo(row.last_seen) : "seen [never]") + "</span>" +
      "</div></div></div>";

    /* 1. chats */
    h += '<div class="shead">Chats</div>';
    if (!chatScaffolded()) {
      h += '<div class="mini-note">chat tables missing: run rsntr chat init on this node.</div>';
    } else {
      var chats = [{ scope: peer, kindWord: "dm", label: "direct" }];
      roomsForPeer(peer).forEach(function (r) {
        chats.push({ scope: r.iri, kindWord: "room", label: r.name });
      });
      chats.sort(function (a, b) {
        var ra = state.ct.recency.get(a.scope) || "", rb = state.ct.recency.get(b.scope) || "";
        return ra < rb ? 1 : -1;
      });
      chats.forEach(function (ch) {
        var last = state.ct.recency.get(ch.scope);
        var unread = state.notif.unread.has(ch.scope);
        h += '<button class="rowbtn" data-chat="' + esc(ch.scope) + '">' +
          '<div class="row-main"><div class="row-line">' +
          '<span class="badge b-well">' + esc(ch.kindWord) + "</span>" +
          '<span class="title">' + esc(ch.label) + "</span>" +
          (unread ? '<span class="unread-dot"></span>' : "") +
          '<span class="when">' + esc(last ? fmtAgo(last) : "") + "</span></div>" +
          '<div class="row-meta"><span class="snip">' +
          esc(last ? "" : "[no messages yet]") + "</span></div>" +
          "</div><span class=\"chev\">&gt;</span></button>";
      });
      h += '<button class="bigbtn" id="new-chat">+ new chat</button>';
    }

    /* 2. projection */
    h += '<div class="shead">Projection</div>';
    if (sc.points === null && sc.pointsErr === null) {
      h += '<div class="mini-note">fetching what they offer you…</div>';
    } else if (sc.pointsErr !== null) {
      h += '<div class="mini-note">' + esc(sc.pointsErr) + "</div>" +
        (/knock|unknown peer/i.test(sc.pointsErr)
          ? '<button class="bigbtn solid" id="pt-knock">knock to request admission</button>'
          : "") +
        '<button class="bigbtn" id="pt-retry">retry</button>';
    } else if (!sc.points.length) {
      h += '<div class="mini-note">this peer offers no points to you.</div>';
    } else {
      h += pointRowsHtml(peer, sc.points);
    }

    /* 3. tech info */
    h += '<div class="shead">Peer info</div>';
    h += '<button class="srow" data-act="petname"><div class="srow-main"><span class="slabel">petname</span>' +
      '<span class="skey">yours only; has no global meaning</span></div>' +
      '<span class="sval">' + esc(name || "[none]") + '</span><span class="chev">…</span></button>';
    h += '<button class="srow" data-act="avatar"><div class="srow-main"><span class="slabel">avatar</span>' +
      '<span class="skey">stored on this node only (avatars table)</span></div>' +
      '<span class="sval">' + (state.avatars.has(peer) ? "change / reset" : "set image") +
      '</span><span class="chev">…</span></button>';
    h += '<button class="srow" data-act="copyid"><div class="srow-main"><span class="slabel">endpoint id</span>' +
      '<span class="skey">_peers.endpoint_id · tap to copy</span></div>' +
      '<span class="sval">' + esc(shortHex(peer)) + "</span></button>";
    if (hello) {
      h += '<div class="srow"><div class="srow-main"><span class="slabel">wire hello</span></div>' +
        '<span class="sval plain">envelope v' + esc(String(hello.ver)) + " · " +
        esc((hello.encodings || []).join(", ") || "?") + "</span></div>";
    }
    h += '<div class="shead" style="padding-top:8px">mods offered</div><div class="chips" id="pi-mods">' +
      (hello && hello.mods && hello.mods.length
        ? hello.mods.map(function (m) { return '<button class="chip" data-mod="' + esc(m) + '">' + esc(m) + "</button>"; }).join("")
        : '<span class="badge b-well">[unknown until reachable]</span>') + "</div>";
    h += '<div class="srow"><div class="srow-main"><span class="slabel">addresses</span></div>' +
      '<span class="sval plain">' + esc(row && row.addrs && row.addrs.length ? row.addrs.join(", ") : "[relay or unknown]") + "</span></div>";
    h += '<div class="srow"><div class="srow-main"><span class="slabel">added</span></div>' +
      '<span class="sval plain">' + esc(row && row.added_at ? fmtAgo(row.added_at) : "-") + "</span></div>";
    h += '<button class="srow" data-act="notes"><div class="srow-main"><span class="slabel">notes</span>' +
      '<span class="skey">_peers.notes</span></div>' +
      '<span class="sval">' + esc((row && row.notes) || "[none]") + '</span><span class="chev">…</span></button>';
    if (p && !p.reachable && p.err) {
      h += '<div class="mini-note">last probe: ' + esc(p.err) + "</div>";
    }
    h += '<button class="bigbtn danger" id="rm-peer">remove peer</button>';
    h += '<div style="height:16px"></div>';
    el.innerHTML = h;
    wireBack(el);

    el.querySelectorAll("[data-chat]").forEach(function (b) {
      b.onclick = function () { pushScreen({ t: "chat", scope: b.getAttribute("data-chat") }); };
    });
    var nc = el.querySelector("#new-chat");
    if (nc) nc.onclick = function () { openNewChatSheet(peer); };
    var retry = el.querySelector("#pt-retry");
    if (retry) retry.onclick = function () { sc.points = null; sc.pointsErr = null; sc.rerender(); sc.fetch(); };
    var kn = el.querySelector("#pt-knock");
    if (kn) kn.onclick = function () {
      knockAndReport(peer, function () {
        sc.points = null; sc.pointsErr = null; sc.rerender(); sc.fetch();
      });
    };
    if (sc.points) wirePointRows(el, peer, sc.points, "");
    el.querySelectorAll("[data-mod]").forEach(function (chip) {
      chip.onclick = function () {
        var m = chip.getAttribute("data-mod");
        if (m === "chat" && chatScaffolded()) { pushScreen({ t: "chat", scope: peer }); return; }
        if (m === "projection") { pushScreen({ t: "proj", peer: peer, path: "", label: "projection" }); return; }
        pushScreen({ t: "modrun", peer: peer, mod: m });
      };
    });
    el.querySelectorAll("[data-act]").forEach(function (b) {
      var act = b.getAttribute("data-act");
      b.onclick = function () {
        if (act === "copyid") copyText(peer, "endpoint id copied");
        else if (act === "petname") {
          inlineEditSval(b, name || "", function (v) {
            if (v === null || v === (name || "")) { sc.rerender(); return; }
            chatSql("UPDATE _peers SET name = ?1 WHERE endpoint_id = ?2",
              [v === "" ? null : v, peer]).then(function () {
                loadContacts().then(sc.rerender);
                toast("petname saved");
              }, function (e) { toast("rename failed: " + e.message); sc.rerender(); });
          });
        } else if (act === "avatar") {
          avatarSheet(peer);
        } else if (act === "notes") {
          promptBox("notes for " + (name || shortHex(peer)), (row && row.notes) || "", "save", function (n) {
            chatSql("UPDATE _peers SET notes = ?1 WHERE endpoint_id = ?2",
              [n === "" ? null : n, peer]).then(function () {
                probePeer(peer, true);
                toast("notes saved");
              }, function (e) { toast("saving notes failed: " + e.message); });
          }, true);
        }
      };
    });
    var ava = el.querySelector(".phead .avatar");
    if (ava) ava.onclick = function () { avatarSheet(peer); };
    var rm = el.querySelector("#rm-peer");
    if (rm) rm.onclick = function () {
      confirmBox("Remove " + (name || shortHex(peer)) + " from _peers? Their rows in your tables stay; this node just stops dialing them.",
        "remove peer", function () {
          chatSql("DELETE FROM _peers WHERE endpoint_id = ?1", [peer]).then(function () {
            toast("peer removed");
            loadContacts();
            popScreen();
          }, function (e) { toast("remove failed: " + e.message); });
        });
    };
  };
  sc.fetch = function () {
    fetchPoints(peer, "").then(function (pts) {
      sc.points = pts;
      /* the successful fetch is the honest reachability probe */
      var p = state.presence.get(peer);
      if (p && !p.reachable) probePeer(peer, true);
      if (sc.el.isConnected) sc.rerender();
    }, function (e) {
      sc.pointsErr = e.message === "unauthorized" ? "signed out" : e.message;
      if (sc.el.isConnected) sc.rerender();
    });
  };
  sc.rerender();
  sc.fetch();
  probePeer(peer, false);
}

/* the CLI's POLICY_UPSERT_SQL: membership implies the send grant */
async function roomMemberGrant(peerId, roomIri, note) {
  await chatSql(
    "INSERT INTO _policy (peer_or_group, table_name, action, effect, note) " +
    "SELECT ?1, ?2, 'chat', 'allow', ?3 " +
    "WHERE NOT EXISTS (SELECT 1 FROM _policy " +
    "  WHERE peer_or_group = ?1 AND table_name = ?2 AND action = 'chat' AND effect = 'allow')",
    [peerId, roomIri, note]);
}
async function addRoomMember(roomIri, peerId, note) {
  await chatSql("INSERT OR IGNORE INTO chat_members (room_id, member, added_at) VALUES (?1, ?2, datetime('now'))",
    [roomIri, peerId]);
  await roomMemberGrant(peerId, roomIri, note);
}
async function createRoom(peerId, name) {
  try {
    var iri = CHAT_ROOM_PREFIX + ulid();
    var me = state.meta.node_id;
    await chatSql("INSERT INTO chat_rooms (room_id, name, host, created_at) VALUES (?1, ?2, ?3, datetime('now'))",
      [iri, name, me]);
    await chatSql("INSERT OR IGNORE INTO chat_members (room_id, member, added_at) VALUES (?1, ?2, datetime('now'))",
      [iri, me]);
    await addRoomMember(iri, peerId, "chat room member (web room create)");
    await loadContacts();
    await loadMembers();
    pushScreen({ t: "chat", scope: iri });
    toast("room created; this node hosts the transcript");
  } catch (e) {
    toast("room creation failed: " + e.message);
  }
}

/* ---- chat screen ----------------------------------------------------- */
function buildChatScreen(sc) {
  var scope = sc.scope;
  var c = contactFor(scope);
  var sub = c.kind === "room"
    ? "room · host " + (c.host ? labelFor(c.host) : "[unknown]")
    : (c.kind === "local" ? "notes to this node" : "direct · one thread per peer");
  var withInfo = c.kind === "room" || c.kind === "peer";
  sc.el.innerHTML = '<div class="nav"><button class="back nav-back" aria-label="go back">' +
    '<svg viewBox="0 0 16 16"><path d="M10.5 3 5.5 8l5 5"/></svg>back</button>' +
    "<h2>" + esc(c.kind === "room" ? c.label : labelFor(scope)) +
    '<span class="nav-sub">' + esc(sub) + "</span></h2>" +
    (withInfo ? '<button class="nav-act" id="chat-info">edit</button>' : "") + "</div>" +
    '<div class="status t-status"></div>' +
    '<div class="chatwrap"><div class="chatlog t-log"></div>' +
    '<div class="composer"><textarea class="t-text" rows="1" spellcheck="false" ' +
    'placeholder="message… (unreachable peers get it from _outbox)"></textarea>' +
    '<button class="send t-send">send</button></div></div>';
  wireBack(sc.el);
  var info = sc.el.querySelector("#chat-info");
  if (info) info.onclick = function () { pushScreen({ t: "chatinfo", scope: scope }); };
  /* light rerender: renames refresh the title without rebuilding the log */
  sc.rerender = function () {
    var cc = contactFor(scope);
    var h2 = sc.el.querySelector(".nav h2");
    if (h2 && h2.firstChild) {
      h2.firstChild.textContent = cc.kind === "room" ? cc.label : labelFor(scope);
    }
  };
  var tab = { contact: c, pane: sc.el, kind: "chat" };
  sc.tab = tab;
  sc.el.querySelector(".t-send").onclick = function () { sendChat(tab); };
  sc.el.querySelector(".t-text").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendChat(tab);
  });
  sc.el.querySelector(".t-log").addEventListener("click", function (ev) {
    var a = ev.target.closest(".att");
    if (a) copyFetchCmd(tab, a.dataset.provider, a.dataset.hash, a.dataset.name);
  });
  if (scope !== null) clearUnread(scope);
  loadChatHistory(tab);
}

/* ---- chat/room info screen -------------------------------------------- */
function buildChatInfoScreen(sc) {
  var scope = sc.scope;
  sc.rerender = function () {
    var c = contactFor(scope);
    var me = state.meta ? state.meta.node_id : null;
    var isRoom = c.kind === "room";
    var hostMe = isRoom && c.host === me;
    var h;
    if (isRoom) {
      h = navBarHtml(c.label, hostMe ? "room · this node hosts it" : "room · host " + (c.host ? labelFor(c.host) : "[unknown]"));
      h += '<div class="phead">' + avatar(scope, true) +
        '<div class="phead-main"><h2>' + esc(c.label) + "</h2>" +
        '<div class="sub">' + esc(scope) + "</div>" +
        '<div class="badges"><span class="badge b-well">room</span>' +
        (hostMe ? '<span class="badge b-on">you host</span>' : "") + "</div></div></div>";

      h += '<div class="shead">Name</div>';
      h += '<button class="srow" id="ci-rename"><div class="srow-main"><span class="slabel">room name</span>' +
        '<span class="skey">' + (hostMe
          ? "members see it on your next message"
          : "display name on this node; the host's name wins on their next message") +
        '</span></div><span class="sval">' + esc(c.label) + '</span><span class="chev">…</span></button>';

      var members = (state.members.get(scope) || []).slice();
      if (c.host && members.indexOf(c.host) < 0) members.unshift(c.host);
      h += '<div class="shead">Members (' + members.length + ")</div>";
      members.forEach(function (m) {
        var self = m === me;
        var isHost = m === c.host;
        var removable = hostMe && !isHost;
        h += '<' + (removable ? "button" : "div") + ' class="srow"' +
          (removable ? ' data-member="' + esc(m) + '"' : "") + ">" +
          '<div class="srow-main"><span class="slabel">' +
          esc(self ? "this node" : labelFor(m)) + '</span><span class="skey">' + esc(shortHex(m)) + "</span></div>" +
          (isHost ? '<span class="badge b-plain">host</span>' : "") +
          (removable ? '<span class="sval">remove</span>' : "") +
          "</" + (removable ? "button" : "div") + ">";
      });
      if (hostMe) {
        h += '<button class="bigbtn" id="ci-add">+ add member</button>' +
          '<div class="mini-note">only admitted peers can join; a new member sees the room with your next message.</div>';
      } else {
        h += '<div class="mini-note">only the host manages the roster.</div>';
      }

      h += '<div class="shead">Danger</div>';
      h += '<button class="bigbtn danger" id="ci-delete">' + (hostMe ? "delete room" : "leave room") + "</button>";
    } else {
      /* dm */
      h = navBarHtml(labelFor(scope), "direct message");
      h += '<div class="phead">' + avatar(scope, true) +
        '<div class="phead-main"><h2>' + esc(labelFor(scope)) + "</h2>" +
        '<div class="sub">' + esc(shortHex(scope)) + "</div>" +
        '<div class="badges"><span class="badge b-well">dm</span></div></div></div>';
      h += '<div class="shead">Peer</div>';
      h += '<button class="srow" id="ci-profile"><div class="srow-main"><span class="slabel">open peer profile</span>' +
        '<span class="skey">presence, projection, tech info</span></div><span class="chev">&gt;</span></button>';
      h += '<button class="srow" id="ci-rename"><div class="srow-main"><span class="slabel">petname</span>' +
        '<span class="skey">yours only; has no global meaning</span></div>' +
        '<span class="sval">' + esc(/^[0-9a-f]{60,}/.test(c.label) ? "[none]" : c.label) +
        '</span><span class="chev">…</span></button>';
      h += '<div class="shead">Danger</div>';
      h += '<button class="bigbtn danger" id="ci-delete">delete conversation history</button>';
      h += '<div class="mini-note">deletes this thread from this node only; the peer keeps their copy.</div>';
    }
    h += '<div style="height:16px"></div>';
    sc.el.innerHTML = h;
    wireBack(sc.el);

    var rename = sc.el.querySelector("#ci-rename");
    if (rename) rename.onclick = function () {
      if (isRoom) {
        inlineEditSval(rename, c.label, function (v) {
          if (v === null || v === "" || v === c.label) { sc.rerender(); return; }
          chatSql("UPDATE chat_rooms SET name = ?1 WHERE room_id = ?2", [v, scope]).then(function () {
            loadContacts().then(function () { renderContacts(); sc.rerender(); rerenderType("chat"); });
            toast("room renamed");
          }, function (e) { toast("rename failed: " + e.message); sc.rerender(); });
        });
      } else {
        var cur = /^[0-9a-f]{60,}/.test(c.label) ? "" : c.label;
        inlineEditSval(rename, cur, function (p) {
          if (p === null || p === cur) { sc.rerender(); return; }
          chatSql("UPDATE _peers SET name = ?1 WHERE endpoint_id = ?2",
            [p === "" ? null : p, scope]).then(function () {
              loadContacts().then(function () { renderContacts(); sc.rerender(); rerenderType("chat"); });
              toast("petname saved");
            }, function (e) { toast("rename failed: " + e.message); sc.rerender(); });
        });
      }
    };
    var ciAva = sc.el.querySelector(".phead .avatar");
    if (ciAva) ciAva.onclick = function () { avatarSheet(scope); };
    var prof = sc.el.querySelector("#ci-profile");
    if (prof) prof.onclick = function () { gotoProfile(scope); };

    sc.el.querySelectorAll("[data-member]").forEach(function (b) {
      var m = b.getAttribute("data-member");
      b.onclick = function () {
        confirmBox("Remove " + labelFor(m) + " from " + c.label + "? Their send grant for this room is retracted; messages they already have stay theirs.",
          "remove member", function () {
            Promise.resolve()
              .then(function () { return chatSql("DELETE FROM chat_members WHERE room_id = ?1 AND member = ?2", [scope, m]); })
              .then(function () { return chatSql("DELETE FROM _policy WHERE peer_or_group = ?1 AND table_name = ?2 AND action = 'chat'", [m, scope]); })
              .then(function () { return loadMembers(); })
              .then(function () { sc.rerender(); toast("member removed"); },
                    function (e) { toast("remove failed: " + e.message); });
          });
      };
    });
    var add = sc.el.querySelector("#ci-add");
    if (add) add.onclick = function () { openAddMemberSheet(sc, scope); };

    var del = sc.el.querySelector("#ci-delete");
    if (del) del.onclick = function () {
      if (isRoom && hostMe) {
        confirmBox("Delete " + c.label + "? The room, its roster, its send grants and this node's transcript go; members keep their copies.",
          "delete room", function () { deleteRoomLocal(scope, true); });
      } else if (isRoom) {
        confirmBox("Leave " + c.label + "? The room and its transcript are removed from this node; the host may still send until they drop you from the roster.",
          "leave room", function () { deleteRoomLocal(scope, false); });
      } else {
        confirmBox("Delete this conversation's history on this node? " + labelFor(scope) + " keeps their copy.",
          "delete history", function () {
            chatSql("DELETE FROM chat_messages WHERE scope = ?1", [scope]).then(function () {
              state.notif.unread.delete(scope);
              loadContacts().then(renderContacts);
              popToChatParent();
              toast("history deleted");
            }, function (e) { toast("delete failed: " + e.message); });
          });
      }
    };
  };
  sc.rerender();
}
/* after deleting a room/thread, land back above the (now dead) chat */
function popToChatParent() {

async function deleteRoomLocal(scope, hosted) {
  try {
    if (hosted) {
      await chatSql("DELETE FROM _policy WHERE table_name = ?1 AND action = 'chat'", [scope]);
    }
    await chatSql("DELETE FROM chat_members WHERE room_id = ?1", [scope]);
    await chatSql("DELETE FROM chat_rooms WHERE room_id = ?1", [scope]);
    await chatSql("DELETE FROM chat_messages WHERE scope = ?1", [scope]);
    state.notif.unread.delete(scope);
    await loadContacts();
    await loadMembers();
    renderContacts();
    popToChatParent();
    toast(hosted ? "room deleted" : "left the room");
  } catch (e) {
    toast((hosted ? "delete" : "leave") + " failed: " + e.message);

}

    '<div class="t-desc" style="margin:0 14px"></div>' +
    '<div class="status t-status"></div><div class="t-grid"></div><div class="t-editor"></div>' +
    '<div style="height:16px"></div>';
  wireBack(sc.el);
  var tab = { pane: sc.el, kind: "table", editingDesc: false,
              tbl: { name: name, offset: 0, limit: 100, columns: [], rows: [], rowids: [], total: 0, selIdx: -1 } };
  sc.tab = tab;
  renderTableDesc(tab);
  loadTablePage(tab);
  sc.el.querySelector("#tbl-csv").onclick = function () { exportCsvFor(name); };
}
async function exportCsvFor(name) {
  try {
    var res = await api("/api/csv/" + encodeURIComponent(name));
    if (!res.ok) {
      var j = await res.json().catch(function () { return null; });
      toast(fmtJsonErr(j).text);
      return;
    }
    downloadBlob(await res.blob(), name + ".csv");
    toast("downloaded " + name + ".csv");
  } catch (err) {
    if (err.message !== "unauthorized") toast("export failed: " + err.message);
  }
}
function exportCsv() { /* superseded by exportCsvFor(name) on the table screen */ }

/* ---- console screen ---------------------------------------------------- */
function buildConsoleScreen(sc) {
  sc.override = null;
  sc.el.innerHTML = navBarHtml("console", "SQL, SPARQL, or Turtle · this node") +
    '<textarea class="console-text" id="cs-text" spellcheck="false" ' +
    'placeholder="the chip guesses the language; tap it to override&#10;SELECT name FROM sqlite_schema WHERE type = \'table\'"></textarea>' +
    '<div class="row"><button class="act" id="cs-run">run</button>' +
    '<button class="ghost" id="cs-lang">sql (auto)</button>' +
    '<label class="mini" id="cs-base-row" style="display:none">base IRI ' +
    '<input type="text" id="cs-base" style="width:12rem"></label></div>' +
    '<div id="cs-out"></div><div style="height:16px"></div>';
  wireBack(sc.el);
  var text = sc.el.querySelector("#cs-text");
  var langBtn = sc.el.querySelector("#cs-lang");
  var curLang = function () { return sc.override || detectLang(text.value); };
  var updateChip = function () {
    var lang = curLang();
    langBtn.textContent = lang + (sc.override ? "" : " (auto)");
    langBtn.classList.toggle("on", !!sc.override);
    sc.el.querySelector("#cs-base-row").style.display = lang === "rdf" ? "" : "none";
  };
  langBtn.onclick = function () {
    var langs = ["sql", "sparql", "rdf"];
    sc.override = sc.override === null ? langs[0]
      : (langs.indexOf(sc.override) + 1 < langs.length ? langs[langs.indexOf(sc.override) + 1] : null);
    updateChip();
  };
  text.addEventListener("input", updateChip);
  var run = async function () {
    var v = text.value;
    if (!v.trim()) return;
    var lang = curLang();
    var out = sc.el.querySelector("#cs-out");
    var res = document.createElement("div");
    res.className = "cmp-result";
    res.innerHTML = '<div class="r-head"><span class="lang">' + esc(lang) + "</span><span>" +
      esc(v.replace(/\s+/g, " ").trim().slice(0, 60)) + '</span></div><div class="status"></div><div class="rbody"></div>';
    out.prepend(res);
    var tab = { status: res.querySelector(".status"), body: res.querySelector(".rbody") };
    try {
      if (lang === "sql") await runSqlInto(tab, v.trim());
      else if (lang === "sparql") await runSparqlInto(tab, v.trim());
      else await loadTurtleInto(tab, v, sc.el.querySelector("#cs-base").value.trim());
      if (/^(insert|update|delete|create|drop|alter|replace)/i.test(v.trim())) loadMeta();
    } catch (err) {
      if (err.message !== "unauthorized") tabStatus(tab, "request failed: " + err.message, "err");
    }
  };
  sc.el.querySelector("#cs-run").onclick = run;
  text.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run();
  });
  updateChip();
}

/* ---- mod runner screen -------------------------------------------------- */
function buildModrunScreen(sc) {
  sc.el.innerHTML = navBarHtml("mod " + sc.mod, labelFor(sc.peer || "")) + '<div class="mr-host"></div>';
  wireBack(sc.el);
  var before = state.ct.embeds.length;
  sc.cleanup = function () {
    state.ct.embeds.splice(before).forEach(function (t) { if (t.cleanup) t.cleanup(); });
  };
  var c = sc.peer === "" ? { kind: "local", scope: "", label: "this node", host: null } : contactFor(sc.peer);
  modRunner(c, sc.mod, sc.el.querySelector(".mr-host"));
}

/* ================================================================== */
/* boot                                                                */
/* ================================================================== */
/* ride the on-screen keyboard: --vvh tracks the visual viewport so the
   chat screen shrinks instead of the page panning; the log stays pinned
   to its newest line while typing */
function initKeyboardFix() {
  if (!window.visualViewport) return;
  var vv = window.visualViewport;
  var apply = function () {
    document.documentElement.style.setProperty("--vvh", vv.height + "px");
    var open = window.innerHeight - vv.height > 60;
    document.body.classList.toggle("kb-open", open);
    if (open) {
      window.scrollTo(0, 0);
      var top = topScreen();
      if (top && top.t === "chat") {
        var log = top.el.querySelector(".t-log");
        if (log) log.scrollTop = log.scrollHeight;
      }
    }
  };
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  document.addEventListener("focusin", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("t-text")) {
      setTimeout(function () { window.scrollTo(0, 0); apply(); }, 60);
    }
  });
  apply();
}

function boot() {
  state.bootRoute = parseRoute();
  applyTheme();
  initKeyboardFix();
  $("tab-peers").onclick = function () { setTab("peers"); };
  $("tab-feed").onclick = function () { setTab("feed"); };
  $("tab-node").onclick = function () { setTab("node"); };
  $("scrim").onclick = closeSheet;
  state.knocks.timer = setInterval(syncKnocks, 30000);
  state.pending.timer = setInterval(syncPending, 30000);  /* fallback; entrain is the live path */

  var unlock = function () { ensureAudio(); };
  document.addEventListener("pointerdown", unlock, { once: true });
  document.addEventListener("keydown", unlock, { once: true });
  window.addEventListener("focus", clearActiveChatUnread);

  $("tok-go").addEventListener("click", function () {
    var t = $("tok-input").value.trim();
    if (!t) return;
    installSession(t).then(function (ok) {
      if (ok) { haveToken(t); start(); }
      else { needToken("token rejected; paste the one printed by rsntr serve"); }
    });
  });
  $("tok-input").addEventListener("keydown", function (e) { if (e.key === "Enter") $("tok-go").click(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }

  /* root screens exist before auth so the shell never flashes empty */
  ["peers", "feed", "node"].forEach(function (t) {
    var el = document.createElement("section");
    el.className = "screen screen-" + t;
    var sc = { t: t, el: el };
    $("screens").appendChild(el);
    state.nav.stacks[t].push(sc);
    buildScreen(sc);
  });
  showTop();

  initAuth().then(function (ok) {
    if (ok) start();
    else needToken();
  });
}
function start() {
  state.booted = true;
  var route = state.bootRoute;
  loadMeta().then(function () {
    rerenderType("node");
    loadAvatars().then(function () { renderContacts(); rerenderType("node"); });
    loadContacts().then(function () {
      loadMembers().then(renderContacts);
      probeAllPeers(false);
      if (route) openRoute(route);
    });
    startInbox();
  }).catch(function (err) {
    if (err.message !== "unauthorized") toast("meta failed: " + err.message);
  });
  openFeed();
  syncKnocks();
  syncPending();
  pendingLoop();
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}

    typedSubjects: typedSubjects, envelopeSubjects: envelopeSubjects, objsOf: objsOf, obj1: obj1,
    litOf: litOf, encodeFrame: encodeFrame, readFrames: readFrames, ttlStr: ttlStr, ulid: ulid,
    reqDoc: reqDoc, entrainDoc: entrainDoc, ntCell: ntCell, cellOfTerm: cellOfTerm,
    graphPayloadTtl: graphPayloadTtl, collectResponse: collectResponse, parsePoint: parsePoint,
    chatMessageDoc: chatMessageDoc, chatExecuteDoc: chatExecuteDoc, detectLang: detectLang,
    nextBackoff: nextBackoff, truncBody: truncBody, loadMuted: loadMuted,
    graphPayloadTriples: graphPayloadTriples, lensGroups: lensGroups, lensFor: lensFor,
    identiconSvg: identiconSvg, mediaWatchCmd: mediaWatchCmd, readMediaHeader: readMediaHeader };
}
