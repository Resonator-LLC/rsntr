[package]
name = "resonator-mod-pdk"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Plugin development kit for Resonator mods (wasm modulation plugins)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# extism-pdk only builds for wasm; the typed ABI structs above stay
# native-testable without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { workspace = true }
