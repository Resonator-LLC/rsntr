[package]
name = "resonator-python"
# Pinned ahead of the workspace: this is the only crate published to PyPI.
# 0.1.2 adds Node.knock (stranger admission requests) and Node.register_mod
# (Python-defined mods).
version = "0.1.2"
edition = { workspace = true }
license = { workspace = true }

[lib]
name = "resonator"
crate-type = ["cdylib", "rlib"]

# No crate-level extension-module feature: maturin enables
# pyo3/extension-module directly (pyproject.toml), so plain cargo
# check/test (and --all-features) always link libpython.

[dependencies]
rsntr = { path = "../cli", default-features = false, features = ["web"] }
resonator-protocol = { path = "../protocol" }
resonator-transport = { path = "../transport" }
resonator-web = { path = "../web" }
resonator-node = { path = "../node" }
resonator-authenticator = { path = "../authenticator" }
serde_json = { workspace = true }
pyo3 = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
rusqlite = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.24"
