name: ci

# Every push and pull request: the Rust workspace, the web client (unit and
# end-to-end), and debug builds of the Android and iOS apps. Nothing here
# needs a secret, so forks run it too.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the client (embedded in the binary)
        run: cd client && npm ci && npm run build
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npm run typecheck
      - run: cd client && npm test
      - run: cd client && npm run build
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # A debug build is enough for the end-to-end tests and much faster.
      # resonator-server has the end-to-end hooks (/e2e/*); resonator is the
      # node, for person mode.
      - run: cargo build -p resonator -p resonator-server
      - run: cd client && npx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: cd client && RESONATOR_BINARY="$PWD/../target/debug/resonator-server" RESONATOR_NODE_BINARY="$PWD/../target/debug/resonator" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: client/e2e/.results
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-35" > /dev/null
      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: apps/android/build.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: resonator-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$x" ] || { echo "no Xcode 26 on this runner:" >&2; ls -d /Applications/Xcode* >&2; exit 1; }
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Tools
        run: |
          brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Simulator build (unsigned)
        run: apps/ios/build.sh simulator

  # The terminal client and the desktop app on every platform they ship for.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli
      - run: cargo build -p rsntr
      - run: cargo run -q -p rsntr -- --version

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup toolchain install stable --profile minimal -c clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cd client && npm ci && npm run build
        shell: bash
      - name: Test and lint
        working-directory: apps/desktop
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
