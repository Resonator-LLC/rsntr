[workspace]
members = ["crates/*"]
# extension needs rusqlite's loadable_extension feature, which must not unify
# with the bundled feature the rest of the workspace links; built standalone,
# see crates/extension/README.md.
exclude = ["crates/extension"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"

# Release binaries ship over the network (npm, Homebrew, curl installers), so
# size is a distribution cost. Measured on the rsntr bin, x86_64 linux, default
# features: 77M plain, 56M stripped, 45M with the settings below. Fat LTO costs
# build time (~1m15s -> ~4m30s here) and is why this is not the dev default.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
iroh = "1"
iroh-tickets = "1"
iroh-gossip = "0.101"
iroh-blobs = "0.103"
noq = "1"
n0-error = "1"
n0-future = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "vtab", "limits", "column_decltype", "functions"] }
oxrdf = "0.3"
oxttl = "0.2"
bytes = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ulid = "1"
regex = "1"
rhai = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
hex = "0.4"
blake3 = "1"
sha2 = "0.10"
libc = "0.2"
extism = "1"
extism-pdk = "1"
pyo3 = { version = "0.24", features = ["abi3-py38"] }
uniffi = "0.28"
