/* ------------------------------------------------------------------ */
/* rsntr mobile console. Design system borrowed from katir:           */
/* one monospace face at one weight (emphasis is size, case, or an    */
/* inverted block - never bold), square corners, no shadows, and the  */
/* Okabe-Ito colour-blind-safe set. BLUE is the only colour that is   */
/* ever ink; good/attn/novel are FILLS carrying --on-fill text, and   */
/* every coloured thing also carries its word.                        */
/* ------------------------------------------------------------------ */
:root {
  --paper:  #eeeeee;
  --well:   #cccccc;
  --rule:   #c0c0c0;
  --rule-2: #8e8e8e;
  --ink:    #222222;
  --ink-2:  #666666;

  --blue:   #00629E;   /* interactive: views, links, selection */
  --good:   #009E73;   /* reachable, watching, ok */
  --attn:   #E69F00;   /* needs you: knocks, unreachable, destructive */
  --novel:  #CC79A7;   /* pings, unread, apps */

  --on-fill: #141414;
  --on-blue: #eeeeee;
  --bar: #eeeeee; --on-bar: #666666; --on-bar-active: #222222;
  --on-ink-accent: #56B4E9;

  --mono: "Departure Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
/* dark: greys re-stepped, never inverted; the chromatic fills keep
   their light values */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141414; --well: #333333; --rule: #333333; --rule-2: #666666;
    --ink: #eeeeee;   --ink-2: #8e8e8e;
    --blue: #56B4E9;  --on-blue: #141414;
    --bar: #1c1c1c;   --on-bar: #8e8e8e; --on-bar-active: #eeeeee;
    --on-ink-accent: #00629E;
  }
}
:root[data-theme="dark"] {
  --paper: #141414; --well: #333333; --rule: #333333; --rule-2: #666666;
  --ink: #eeeeee;   --ink-2: #8e8e8e;
  --blue: #56B4E9;  --on-blue: #141414;
  --bar: #1c1c1c;   --on-bar: #8e8e8e; --on-bar-active: #eeeeee;
  --on-ink-accent: #00629E;
}
:root[data-theme="light"] {
  --paper: #eeeeee; --well: #cccccc; --rule: #c0c0c0; --rule-2: #8e8e8e;
  --ink: #222222;   --ink-2: #666666;
  --blue: #00629E;  --on-blue: #eeeeee;
  --bar: #eeeeee;   --on-bar: #666666; --on-bar-active: #222222;
  --on-ink-accent: #56B4E9;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { overflow-x: clip; margin: 0; padding: 0; background: var(--well); }
body {
  touch-action: manipulation;
  font: 400 12px/1.45 var(--mono);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
}
h1, h2, h3 { margin: 0; font-weight: 400; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule-2); border-radius: 0; padding: .45em .6em;
}
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: -1px; }
textarea { resize: vertical; }

/* ---- the app column ------------------------------------------------ */
#app {
  position: relative; margin: 0 auto; max-width: 520px; min-height: 100vh; min-height: 100dvh;
  background: var(--paper); display: flex; flex-direction: column;
  border-left: 1px solid var(--rule-2); border-right: 1px solid var(--rule-2);
}
@media (max-width: 521px) { #app { border-left: none; border-right: none; } }

#screens { flex: 1; display: flex; flex-direction: column; }
.screen {
  flex: 1; display: none; flex-direction: column;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}
/* Only the root tabs pad for the notch themselves: every pushed
   sub-screen starts with a sticky .nav that carries its own
   safe-area-inset-top, and padding both doubles the inset - the page
   content shifts down and a blank band opens above the nav. */
.screen-peers, .screen-feed, .screen-node {
  padding-top: env(safe-area-inset-top, 0px);
}
.screen.active { display: flex; }

/* ---- alarm strip: severity buys height, nothing else does ---------- */
#alarm {
  position: sticky; top: 0; z-index: 9; display: none;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
  background: var(--attn); color: var(--on-fill); font-size: 13.75px;
}
#alarm.show { display: block; }

/* ---- sub-screen nav bar (root tabs have none) ---------------------- */
.nav {
  position: sticky; top: 0; z-index: 8; display: flex; align-items: center;
  min-height: 48px; padding: 0 6px; padding-top: env(safe-area-inset-top, 0px);
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.nav .back { display: flex; align-items: center; min-width: 44px; min-height: 44px; padding: 0 8px; color: var(--blue); flex: none; }
.nav .back svg { width: 14px; height: 14px; margin-right: 4px; fill: none; stroke: currentColor; stroke-width: 2; }
.nav h2 { font-size: 16.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nav-sub { display: block; font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nav-hint { margin-left: auto; padding: 0 8px 0 10px; color: var(--ink-2); font-size: 11px; text-align: right; max-width: 45%; flex: none; }
.nav .nav-act { margin-left: auto; min-height: 44px; padding: 0 12px; display: flex; align-items: center; color: var(--blue); text-transform: uppercase; flex: none; }

.shead {
  padding: 16px 14px 6px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-2);
}
.pagesub { padding: 10px 14px; color: var(--ink-2); }
.mini-note { padding: 8px 14px 14px; color: var(--ink-2); }
.mini { font-size: 11px; color: var(--ink-2); }

/* ---- rows ---------------------------------------------------------- */
.rowbtn {
  display: flex; align-items: center; width: 100%; min-height: 58px;
  padding: 8px 14px; border-bottom: 1px solid var(--rule); background: none;
}
.rowbtn:active { background: var(--well); }
.rowbtn .avatar { flex: none; margin-right: 12px; }
.row-main { flex: 1; min-width: 0; }
.row-line { display: flex; align-items: baseline; min-width: 0; }
.row-line .title { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-line .when { margin-left: auto; padding-left: 8px; color: var(--ink-2); font-size: 11px; white-space: nowrap; }
.row-meta { display: flex; align-items: center; margin-top: 3px; color: var(--ink-2); font-size: 11px; min-width: 0; }
.row-meta .snip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowbtn .chev { flex: none; margin-left: 10px; color: var(--rule-2); }
.hexname { color: var(--ink-2); }
.unread-dot { flex: none; width: 7px; height: 7px; margin-left: 8px; background: var(--novel); }

/* ---- badges: colour never travels without its word ----------------- */
.badge {
  display: inline-block; font-size: 11px; line-height: 1.45; text-transform: uppercase;
  padding: 1px 5px; margin-right: 6px; border: 1px solid transparent; white-space: nowrap; flex: none;
}
.b-on    { background: var(--good);  color: var(--on-fill); }
.b-bad   { background: var(--attn);  color: var(--on-fill); }
.b-novel { background: var(--novel); color: var(--on-fill); }
.b-blue  { background: var(--blue);  color: var(--on-blue); }
.b-plain { background: var(--paper); color: var(--ink-2); border-color: var(--rule-2); }
.b-well  { background: var(--well);  color: var(--ink-2); text-transform: none; }

/* ---- needs-you card (knocks) --------------------------------------- */
.needs { margin: 12px 14px 6px; border: 1px solid var(--ink); }
.needs .needs-head { display: flex; align-items: center; padding: 10px 12px 0; }
.needs .needs-head b { font-weight: 400; font-size: 13.75px; text-transform: uppercase; }
.needs .needs-head .badge { margin-left: auto; margin-right: 0; }
.knockrow { display: flex; align-items: center; width: 100%; padding: 10px 12px; margin-top: 8px; border-top: 4px solid var(--attn); min-height: 56px; cursor: pointer; }
.knockrow:active { background: var(--well); }
.knockrow .avatar { margin-right: 12px; }

/* ---- big actions --------------------------------------------------- */
.bigbtn {
  display: flex; align-items: center; justify-content: center; width: calc(100% - 28px);
  margin: 8px 14px; min-height: 44px; border: 1px solid var(--blue); color: var(--blue);
  text-transform: uppercase; font-size: 13.75px;
}
.bigbtn:active { background: var(--well); }
.bigbtn.solid { background: var(--blue); color: var(--on-blue); border-color: transparent; }
.bigbtn.good { background: var(--good); color: var(--on-fill); border-color: transparent; }
.bigbtn.danger { border-color: var(--attn); color: var(--ink); }

/* ---- settings/info rows -------------------------------------------- */
.srow { display: flex; align-items: center; width: 100%; min-height: 52px; padding: 8px 14px; border-bottom: 1px solid var(--rule); }
button.srow:active { background: var(--well); }
.srow-main { flex: 1; min-width: 0; margin-right: 10px; }
.slabel { display: block; font-size: 13.75px; overflow-wrap: anywhere; }
.skey { display: block; margin-top: 2px; color: var(--ink-2); font-size: 11px; overflow-wrap: anywhere; }
.sval { flex: none; color: var(--blue); font-size: 13.75px; max-width: 48%; overflow-wrap: anywhere; text-align: right; }
.sval.plain { color: var(--ink); }
.srow .chev { flex: none; margin-left: 8px; color: var(--rule-2); }
.chips { display: flex; flex-wrap: wrap; padding: 4px 14px 10px; }
.chip {
  font: inherit; font-size: 11px; text-transform: uppercase; background: var(--paper);
  color: var(--ink-2); border: 1px solid var(--rule-2); padding: 4px 9px;
  margin: 0 6px 6px 0; cursor: pointer;
}
.chip.on { border-color: var(--good); background: var(--good); color: var(--on-fill); }

/* ---- profile head -------------------------------------------------- */
.phead { display: flex; align-items: center; padding: 16px 14px 4px; }
.phead .avatar { margin-right: 14px; }
.phead-main { min-width: 0; flex: 1; }
.phead-main h2 { font-size: 22px; overflow-wrap: anywhere; }
.phead-main .sub { margin-top: 3px; color: var(--ink-2); font-size: 11px; overflow-wrap: anywhere; }
.phead-main .badges { margin-top: 6px; display: flex; flex-wrap: wrap; }
.avatar { width: 40px; height: 40px; border: 1px solid var(--rule-2); background: var(--paper); flex: none; overflow: hidden; }
.avatar.big { width: 60px; height: 60px; }
.avatar svg { display: block; width: 100%; height: 100%; }
.avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.phead .avatar { cursor: pointer; }
.sval-input { width: 10rem; max-width: 44vw; padding: 6px 8px; font: inherit; text-align: right; }

.idblock { margin: 8px 14px; padding: 10px; border: 1px solid var(--rule-2); }
.idblock .hex { font-size: 12px; overflow-wrap: anywhere; }
.idblock .idact { margin-top: 8px; display: flex; flex-wrap: wrap; }
.idblock .idact button, .ghostbtn {
  min-height: 36px; padding: 0 10px; margin: 0 8px 0 0; border: 1px solid var(--blue);
  color: var(--blue); text-transform: uppercase; display: inline-flex; align-items: center; font-size: 11px;
}

/* ---- status lines (kept class names) ------------------------------- */
.status { font-size: 12px; margin: 6px 14px; min-height: 1.2em; color: var(--ink-2); }
.status.err { color: var(--ink); }
.status.err:not(:empty)::before { content: "error "; background: var(--attn); color: var(--on-fill); padding: 0 4px; margin-right: 5px; text-transform: uppercase; font-size: 11px; }
.status.warn { color: var(--ink); }
.status.warn:not(:empty)::before { content: "note "; background: var(--well); color: var(--ink-2); padding: 0 4px; margin-right: 5px; text-transform: uppercase; font-size: 11px; }
.status.ok { color: var(--ink-2); }

/* ---- grids (kept class names, restyled) ---------------------------- */
.gridwrap {
  overflow: auto; max-height: 60vh; margin: 6px 14px;
  border: 1px solid var(--rule-2); background: var(--paper);
}
table.grid { border-collapse: collapse; width: 100%; font-size: 12px; }
table.grid th {
  position: sticky; top: 0; background: var(--well); text-align: left;
  padding: 5px 8px; border-bottom: 1px solid var(--rule-2);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
  white-space: nowrap; font-weight: 400;
}
table.grid td {
  padding: 4px 8px; border-bottom: 1px solid var(--rule);
  white-space: pre-wrap; word-break: break-word; vertical-align: top; max-width: 22rem;
}
table.grid tr.sel td { background: var(--well); }
table.grid tr.clickable { cursor: pointer; }
td .null { color: var(--rule-2); }
td .note { color: var(--ink-2); font-size: .85em; margin-left: .3em; }
pre.out {
  background: var(--well); border: 1px solid var(--rule);
  padding: 8px 10px; overflow: auto; margin: 6px 14px;
  max-height: 50vh; font-size: 11px; white-space: pre-wrap; word-break: break-word;
}

/* ---- forms (kept fieldset structure, restyled) --------------------- */
fieldset { border: 1px solid var(--rule-2); padding: 10px 12px; margin: 8px 14px; background: var(--paper); }
legend { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 0 4px; }
label.f { display: block; margin: 8px 0; font-size: 12px; }
label.f span.n { display: block; margin-bottom: 3px; color: var(--ink-2); text-transform: uppercase; font-size: 11px; }
label.f span.req { color: var(--attn); }
label.f input, label.f select { width: 100%; min-height: 40px; }
label.f .hint { color: var(--ink-2); font-size: 11px; margin-left: .4em; }
.row { display: flex; gap: 8px; align-items: center; margin: 8px 14px; flex-wrap: wrap; }
fieldset .row, .pt-form .row { margin-left: 0; margin-right: 0; }
button.act {
  font-size: 12px; text-transform: uppercase; background: var(--blue); color: var(--on-blue);
  border: 1px solid transparent; padding: 10px 16px; min-height: 40px; cursor: pointer;
}
button.act:disabled { opacity: .45; cursor: default; }
button.ghost {
  font-size: 11px; text-transform: uppercase; background: none; color: var(--ink-2);
  border: 1px solid var(--rule-2); padding: 8px 10px; min-height: 36px; cursor: pointer;
}
button.ghost.on { color: var(--on-fill); border-color: transparent; background: var(--good); }
button.ghost.danger, button.danger { border-color: var(--attn); color: var(--ink); }
button.mini-act {
  font-size: 11px; background: none; color: var(--ink-2); border: 1px solid var(--rule);
  padding: 2px 6px; cursor: pointer;
}

/* ---- point rows ---------------------------------------------------- */
.point { display: block; width: 100%; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.point:active { background: var(--well); }
.pt-line { display: flex; align-items: center; min-width: 0; }
.pt-line .title { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-line .badge { margin-left: auto; margin-right: 0; }
.pt-comment { margin-top: 3px; color: var(--ink-2); font-size: 11px; overflow-wrap: anywhere; }
.pt-form { padding: 4px 14px 8px; }
.pt-run {
  margin: 10px 0 0; width: 100%; min-height: 44px; display: flex; align-items: center;
  justify-content: center; background: var(--blue); color: var(--on-blue); text-transform: uppercase; font-size: 13.75px;
}
.pt-run.watching { background: var(--good); color: var(--on-fill); }
.pt-run.danger { background: var(--attn); color: var(--on-fill); }

/* ---- chat ---------------------------------------------------------- */
.chatwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chatlog, .t-log { flex: 1; overflow-y: auto; padding: 8px 0 12px; }
.msg { padding: 7px 14px; }
.msg .meta { display: flex; align-items: baseline; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.msg .body { margin-top: 2px; font-size: 13.75px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { box-shadow: inset 4px 0 0 var(--blue); }
.msg.me .meta { color: var(--blue); }
.att {
  display: inline-flex; align-items: center; margin-top: 4px; padding: 6px 8px;
  border: 1px dashed var(--rule-2); color: var(--blue); font-size: 11px; cursor: pointer;
  overflow-wrap: anywhere;
}
.composer {
  position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  display: flex; align-items: flex-end; padding: 8px 14px; background: var(--paper);
  border-top: 1px solid var(--rule);
}
.composer textarea, .composer .t-text { flex: 1; min-height: 44px; max-height: 120px; padding: 10px; resize: none; }
.composer .send { flex: none; min-width: 64px; min-height: 44px; margin-left: 8px; display: flex; align-items: center; justify-content: center; background: var(--blue); color: var(--on-blue); text-transform: uppercase; }

/* ---- feed ---------------------------------------------------------- */
.filterbar { display: flex; overflow-x: auto; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.filterbar button { flex: none; margin-right: 8px; min-height: 32px; padding: 0 10px; border: 1px solid var(--rule-2); color: var(--ink-2); text-transform: uppercase; font-size: 11px; display: flex; align-items: center; }
.filterbar button.on { border-color: var(--blue); color: var(--blue); box-shadow: inset 0 -3px 0 var(--blue); }
.fev { display: block; width: 100%; padding: 9px 14px; border-bottom: 1px solid var(--rule); }
.fev:active { background: var(--well); }
.fev-line { display: flex; align-items: center; min-width: 0; }
.fev-line .src { font-size: 13.75px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fev-line .when { margin-left: auto; padding-left: 8px; color: var(--ink-2); font-size: 11px; white-space: nowrap; }
.fev-body { margin-top: 3px; font-size: 12px; overflow-wrap: anywhere; }
.pend-actions { margin-top: 6px; display: flex; gap: 8px; }
.pend-actions button { flex: 1; padding: 7px 0; font: inherit; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
.pend-ok { border-color: var(--accent, #4caf50) !important; color: var(--accent, #4caf50) !important; }
.pend-no { opacity: 0.8; }
.pend-actions button:disabled { opacity: 0.5; cursor: default; }
.fev-body.dim { color: var(--ink-2); }
.fev.is-new { box-shadow: inset 4px 0 0 var(--novel); }
.fev .ttl { margin-top: 5px; padding: 6px 8px; background: var(--well); color: var(--ink-2); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; display: none; }
.fev.ttl-open .ttl { display: block; }
.feed-empty { padding: 40px 14px; text-align: center; color: var(--ink-2); }

/* ---- lens cards (kept class names, restyled) ------------------------ */
.lens { display: flex; flex-direction: column; margin: 6px 14px; max-height: 60vh; overflow: auto; }
.lens .card { border: 1px solid var(--rule-2); background: var(--paper); padding: 8px 10px; margin-bottom: 8px; }
.lens .card .hd { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.lens .card .hd .subj { word-break: break-all; font-size: 13.75px; }
.lens .card .hd .cls { color: var(--ink-2); font-size: 11px; text-transform: uppercase; margin-left: auto; white-space: nowrap; }
.lens .card .pr { display: flex; gap: 8px; font-size: 11px; padding: 1px 0; }
.lens .card .pr .p { color: var(--ink-2); min-width: 8rem; flex-shrink: 0; word-break: break-all; }
.lens .card .pr .o { word-break: break-word; white-space: pre-wrap; }
.lens .msgcard .body { background: var(--well); padding: 4px 8px; white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
.lens-out { min-width: 0; }

/* ---- media / hologram ---------------------------------------------- */
.mediabox { margin: 6px 0; }
.mediabox video { width: 100%; max-height: 60vh; background: #000; border: 1px solid var(--rule-2); }
.mediabox .notice { font-size: 12px; color: var(--ink); margin: 8px 14px; }
.mediabox code { background: var(--well); padding: .1rem .3rem; overflow-wrap: anywhere; }
.holobox { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.holobox > .row { display: none; } /* the app screen's nav is the chrome */
.holo-frame { flex: 1; width: 100%; border: none; background: #fff; min-height: 50vh; }
.screen-app .t-out { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.screen-app .t-status:empty { display: none; }

/* grant picker inside the knock screen */
.k-pick { padding: 0 14px; }
.k-pick .row { margin: 8px 0; }
.k-pick .mini { display: block; margin-bottom: 6px; }
.k-pick .k-grants { display: flex; flex-wrap: wrap; }

/* ---- doorbar (kept) ------------------------------------------------ */
.doorbar { position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; gap: 12px; align-items: center; justify-content: center;
  background: var(--attn); color: var(--on-fill);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; font-size: 13.75px; }
.doorbar button { background: var(--on-fill); color: var(--paper); border: none;
  font: inherit; padding: 4px 12px; cursor: pointer; text-transform: uppercase; }

/* ---- tab bar ------------------------------------------------------- */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px; z-index: 10;
  display: flex; background: var(--bar); border-top: 1px solid var(--rule-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  position: relative; flex: 1; min-height: 60px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: var(--on-bar); text-transform: uppercase; font-size: 11px;
}
.tab svg { width: 18px; height: 18px; margin-bottom: 4px; fill: currentColor; }
.tab.is-active { color: var(--on-bar-active); box-shadow: inset 0 3px 0 var(--blue); }
.tab.is-active svg { color: var(--blue); }
.tab-lbl { display: flex; align-items: baseline; }
.tab-cnt { margin-left: 5px; color: var(--on-bar); font-variant-numeric: tabular-nums; }
.tab-cnt:empty { display: none; }
.tab-cnt.hot { background: var(--novel); color: var(--on-fill); padding: 0 4px; }
.tab-dot { position: absolute; top: 8px; left: 50%; margin-left: 12px; width: 7px; height: 7px; background: var(--attn); display: none; }
.tab-dot.show { display: block; }

/* ---- sheet --------------------------------------------------------- */
#scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(20,20,20,.55); z-index: 12; display: none; }
#scrim.show { display: block; }
#sheet {
  position: fixed; left: 50%; transform: translate(-50%, 100%); bottom: 0; width: 100%; max-width: 520px;
  max-height: 88%; z-index: 13; background: var(--paper); border-top: 2px solid var(--ink);
  display: flex; flex-direction: column; transition: transform 160ms ease-out; visibility: hidden;
}
#sheet.show { transform: translate(-50%, 0); visibility: visible; }
.grab { align-self: center; width: 36px; height: 4px; margin: 8px 0 4px; background: var(--rule-2); flex: none; }
#sheet-body { overflow-y: auto; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
#sheet h3 { padding: 6px 14px 10px; font-size: 22px; }
.qrbox { margin: 8px 14px 4px; padding: 14px; border: 1px solid var(--rule-2); display: flex; flex-direction: column; align-items: center; }
.qrbox img, .qrbox video { width: 220px; height: 220px; background: #fff; padding: 6px; object-fit: cover; }
.qrbox .qrnote { margin-top: 8px; color: var(--ink-2); font-size: 11px; text-align: center; }
.tickettext { margin: 8px 14px; padding: 8px; background: var(--well); font-size: 11px; color: var(--ink-2); overflow-wrap: anywhere; max-height: 7em; overflow: auto; }

/* ---- toast / confirm ----------------------------------------------- */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); width: calc(100% - 28px); max-width: 492px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  display: none; align-items: center; background: var(--ink); color: var(--paper);
  padding: 12px 14px; font-size: 13.75px;
}
#toast.show { display: flex; }
#toast .toast-act { margin-left: auto; padding-left: 12px; color: var(--on-ink-accent); text-transform: uppercase; }
#confirm {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 14;
  width: calc(100% - 56px); max-width: 360px; background: var(--paper); border: 2px solid var(--ink);
  padding: 14px; display: none;
}
#confirm.show { display: block; }
#confirm p { margin: 0 0 12px; font-size: 13.75px; overflow-wrap: anywhere; }
#confirm button { display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; border: 1px solid var(--rule-2); text-transform: uppercase; margin-top: 8px; }
#confirm .do-it { background: var(--attn); color: var(--on-fill); border-color: transparent; }
#confirm input { width: 100%; margin: 0 0 4px; }

/* ---- token overlay (kept ids) -------------------------------------- */
#overlay { position: fixed; inset: 0; background: var(--paper); display: none; align-items: center; justify-content: center; z-index: 20; }
#overlay.show { display: flex; }
#overlay .card { border: 2px solid var(--ink); padding: 24px; max-width: 26rem; margin: 14px; }
#overlay .card h1 { font-size: 22px; letter-spacing: .2em; margin-bottom: 6px; }
#overlay .card p { font-size: 12px; color: var(--ink-2); }
#overlay input { width: 100%; margin: 8px 0; }

/* ---- console / composer -------------------------------------------- */
.console-text { width: calc(100% - 28px); margin: 8px 14px 0; min-height: 7em; font-size: 12px; }
.cmp-result { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 2px; }
.cmp-result .r-head { display: flex; align-items: baseline; padding: 4px 14px 0; color: var(--ink-2); font-size: 11px; }
.cmp-result .r-head .lang { text-transform: uppercase; color: var(--blue); margin-right: 8px; }

/* ---- touch keyboards ----------------------------------------------- */
/* 16px inputs: anything smaller makes iOS zoom-and-pan the page on
   focus, which is most of "the whole view moves" */
@media (pointer: coarse) {
  input, textarea, select, .composer .t-text { font-size: 16px; }
}
/* the chat screen owns exactly the visual viewport: the log scrolls
   inside it, the page never scrolls, and when the keyboard opens the
   screen shrinks with --vvh so the composer rides just above the keys */
.screen-chat.active {
  height: var(--vvh, 100dvh); max-height: var(--vvh, 100dvh); overflow: hidden;
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
}
.screen-chat .composer { position: static; }
body.kb-open .screen-chat.active { padding-bottom: 0; }
body.kb-open #tabbar { display: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="app">
  <div id="alarm"></div>
  <main id="screens"></main>

  <nav id="tabbar">
    <button class="tab" id="tab-peers" aria-label="Peers">
      <span class="tab-dot" id="dot-peers"></span>
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="4" height="4"/><rect x="10" y="2" width="4" height="4"/><rect x="2" y="8" width="4" height="6"/><rect x="10" y="8" width="4" height="6"/></svg>
      <span class="tab-lbl">Peers<span class="tab-cnt" id="cnt-peers"></span></span>
    </button>
    <button class="tab" id="tab-feed" aria-label="Feed">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="3" width="12" height="2"/><rect x="2" y="7" width="9" height="2"/><rect x="2" y="11" width="12" height="2"/></svg>
      <span class="tab-lbl">Feed<span class="tab-cnt" id="cnt-feed"></span></span>
    </button>
    <button class="tab" id="tab-node" aria-label="Qualia">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="6" y="2" width="4" height="4"/><rect x="6" y="7" width="4" height="2"/><rect x="2" y="10" width="12" height="4"/></svg>
      <span class="tab-lbl">Qualia</span>
    </button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true">
    <span class="grab"></span>
    <div id="sheet-body"></div>
  </div>
  <div id="confirm" role="alertdialog"></div>
  <div id="toast"></div>
</div>

<div id="overlay">
  <div class="card">
    <h1>RSNTR</h1>
    <p>This console needs the capability token printed by
       <code>rsntr serve --web</code>. Open the printed URL (token rides the
       fragment), or paste the token here. Once connected this browser
       stays signed in.</p>
    <input type="text" id="tok-input" placeholder="capability token" spellcheck="false" autocomplete="off">
    <div class="row" style="margin:0"><button class="act" id="tok-go">connect</button></div>
    <div class="status err" id="tok-status"></div>
  </div>
</div>

<script>
"use strict";
/* ================================================================== */
/* state (UI layer; field names shared with the protocol core)         */
/* ================================================================== */
var state = {
  token: null,
  meta: null,
  tables: [],
  view: null,
  chat: { rooms: new Map(), peerNames: new Map() },
  ct: { loaded: false, contacts: [], tabs: [], nextId: 1, filter: "", recency: new Map(),
        sel: null, embeds: [] },
  inbox: { running: false, ctrl: null, backoff: 1000, watermark: null },
  notif: { muted: loadMuted(), unread: new Set(), audio: null },
  logTtl: loadLogTtl(),
  feed: null,
  /* the three-tab shell */
  nav: { tab: "peers", stacks: { peers: [], feed: [], node: [] } },
  presence: new Map(),   /* peer id -> {t, probing, reachable, hello, err, row} */
  members: new Map(),    /* room iri -> [member ids] */
  watches: new Map(),    /* watchKey -> {ctrl, peer, iri, label, live} */
  feedEv: [],            /* transient feed, newest first, capped */
  feedSeen: new Date().toISOString(),
  health: { feed: "idle", inbox: "off" },
  theme: loadTheme(),
  avatars: new Map(),    /* subject -> data URI (from the avatars table) */
  avatarsReady: false,
  scan: null             /* live qr scan session, torn down with the sheet */
};

/* ================== protocol core (preserved) ================== */
/* ================================================================== */
/* constants                                                           */
/* ================================================================== */
var MAX_FRAME_LEN = 256 * 1024;
var NS = {
  rsntr: "http://resonator.network/v3/rsntr#",
  xsd:   "http://www.w3.org/2001/XMLSchema#",
  rdf:   "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
  rdfs:  "http://www.w3.org/2000/01/rdf-schema#"
};
var R = NS.rsntr, RDF = NS.rdf, RDFS = NS.rdfs, XSD = NS.xsd;

/* ================================================================== */
/* frame codec: u32-LE length prefix + one UTF-8 Turtle document.      */
/* Chunk boundaries are arbitrary; reassemble strictly by prefix.      */
/* ================================================================== */
function encodeFrame(doc) {
  var body = new TextEncoder().encode(doc);
  if (body.length > MAX_FRAME_LEN) throw new Error("frame over budget: " + body.length);
  var out = new Uint8Array(4 + body.length);
  new DataView(out.buffer).setUint32(0, body.length, true);
  out.set(body, 4);
  return out;
}

/* async generator over a ReadableStream body yielding Turtle docs */
async function* readFrames(body) {
  var reader = body.getReader();
  var buf = new Uint8Array(0);
  var dec = new TextDecoder("utf-8", { fatal: false });
  try {
    for (;;) {
      var r = await reader.read();
      if (r.value && r.value.length) {
        var nb = new Uint8Array(buf.length + r.value.length);
        nb.set(buf, 0);
        nb.set(r.value, buf.length);
        buf = nb;
      }
      for (;;) {
        if (buf.length < 4) break;
        var len = new DataView(buf.buffer, buf.byteOffset, 4).getUint32(0, true);
        if (len > MAX_FRAME_LEN) throw new Error("frame over budget: " + len);
        if (buf.length < 4 + len) break;
        var doc = dec.decode(buf.subarray(4, 4 + len));
        buf = buf.slice(4 + len);
        if (doc.length) yield doc;
      }
      if (r.done) {
        if (buf.length) throw new Error("truncated frame at end of stream");
        return;
      }
    }
  } finally {
    try { reader.releaseLock(); } catch (e) { /* stream may be errored */ }
  }
}

/* ================================================================== */
/* turtle parser (subset sufficient for envelope frames)               */
/* terms: {t:"iri"|"blank"|"lit", v, dt?, lang?}                       */
/* ================================================================== */
function parseTurtle(src) {
  var i = 0, n = src.length, bn = 0;

    var g = graphIndex(parseTurtle(res.generic[k].doc));
    var subs = envelopeSubjects(g);
    for (var m = 0; m < subs.length; m++) {
      var sub = subs[m], s = sub.s;
      if (sub.cls === "Hologram") size = intLit(g, s, R + "size");
      else if (sub.cls === "Chunk") {
        var data = litOf(g, s, R + "data");
        if (data !== null) chunks.push({ seq: intLit(g, s, R + "seq") || 0, bytes: b64bytes(data) });
      }
    }
  }
  chunks.sort(function (a, b) { return a.seq - b.seq; });
  var total = chunks.reduce(function (a, c) { return a + c.bytes.length; }, 0);
  if (size !== null && total !== size) return null;
  var body = new Uint8Array(total), off = 0;
  for (var j = 0; j < chunks.length; j++) { body.set(chunks[j].bytes, off); off += chunks[j].bytes.length; }
  return new TextDecoder("utf-8").decode(body);
}

/* JSON scalar from the guest -> one Turtle param term */
function guestParamTerm(v) {
  if (v === null || v === undefined) return "rsntr:null";
  if (typeof v === "boolean") return v ? "true" : "false";
  if (typeof v === "number" && isFinite(v)) {
    return Number.isInteger(v) ? String(v) : String(v);
  }
  if (typeof v === "string") return ttlStr(v);
  throw new Error("params must be JSON scalars");
}

async function openHologramInto(tab, pt) {
  if (tab.holo) { tab.holo.teardown(); tab.holo = null; }
  var out = tab.pane.querySelector(".t-out");
  if (!pt.mod) { paneStatus(tab, "hologram point carries no rsntr:mod", "warn"); return; }
  paneStatus(tab, "reconstructing hologram " + pt.label + " from " + prjPeerLabel(tab) + "...");
  try {
    var res = await postFrames("/request" + peerSuffix(tab.peer),
      [reqDoc("Query", pt.mod, pt.signal || "hologram", null)]);
    var h = await collectHologram(readFrames(res.body));
    if (h.denied) { paneStatus(tab, "denied: " + h.denied, "warn"); return; }
    if (h.error) { paneStatus(tab, "error [" + h.error.code + "] " + h.error.reason, "err"); return; }
    if (h.html === null) { paneStatus(tab, "response carried no rsntr:Hologram header", "warn"); return; }
    mountHologram(tab, out, tab.peer, pt.mod, h.html);
    paneStatus(tab, "hologram mounted: " + pt.label, "ok");
  } catch (err) {
    if (err.message !== "unauthorized") paneStatus(tab, "hologram failed: " + err.message, "err");
  }
}

/* mount + broker. The peer and mod pins come from this closure, never
   from guest messages (hologram-protocol.md 5). */
function mountHologram(tab, container, peer, mod, html) {
  /* full-tab mode: while a hologram is mounted the projection menu
     yields; go back (or close) restores it */
  if (tab.pane) tab.pane.classList.add("holo-on");
  container.innerHTML = '<div class="holobox">' +
    '<div class="row"><button class="ghost t-close">close</button>' +
    '<button class="ghost t-permalink">copy link</button>' +
    '<span class="mini">' + esc(mod) + "@" + esc(peer ? peer.slice(0, 8) : "local") +
    ", sandboxed</span></div></div>";
  var box = container.querySelector(".holobox");
  var iframe = document.createElement("iframe");
  iframe.className = "holo-frame";
  /* opaque origin, scripts only: no cookies, no storage, no origin,
     never allow-same-origin */
  iframe.setAttribute("sandbox", "allow-scripts");
  var reqCtrls = new Set();
  var entrains = new Map(); /* guest id -> {ctrl, acked} */
  var medias = new Map();   /* guest id -> AbortController */
  var duplexes = new Map(); /* guest id -> duplex session state */

  function post(m) {
    if (iframe.contentWindow) iframe.contentWindow.postMessage({ hg: 1, m: m }, "*");
  }
  function postErr(id, code, reason, denied) {
    post({ t: "result", id: id, ok: false, denied: !!denied, error: { code: code, reason: reason || "" } });
  }
  function rowToGuest(row) {
    return { seq: row.seq, cells: row.cells };
  }

  async function guestRequest(m) {
    var cls = m.t === "query" ? "Query" : "Execute";
    var terms;
    try {
      terms = (m.params || []).map(guestParamTerm);
    } catch (e) { postErr(m.id, "protocol-error", e.message); return; }
    var ctrl = new AbortController();
    reqCtrls.add(ctrl);
    try {
      var res = await postFrames("/request" + peerSuffix(peer),
        [reqDoc(cls, mod, String(m.signal || ""), terms.length ? terms : null)], ctrl.signal);
      var out = await collectResponse(readFrames(res.body));
      if (out.denied !== null) postErr(m.id, "auth-denied", out.denied, true);
      else if (out.error) postErr(m.id, out.error.code, out.error.reason);
      else post({ t: "result", id: m.id, ok: true, res: {
        columns: out.columns,
        rows: out.rows.map(rowToGuest),
        done: out.done,
        generic: out.generic,
        graphTtl: out.graphTtl
      } });
    } catch (err) {
      if (err.name === "AbortError") postErr(m.id, "protocol-error", "hologram unmounted");
      else if (err.message === "unauthorized") postErr(m.id, "auth-denied", "web session expired", true);
      else postErr(m.id, "protocol-error", err.message);
    } finally {
      reqCtrls.delete(ctrl);
    }
  }

  async function guestEntrain(m) {
    var point = String(m.point || "");
    var live = { ctrl: new AbortController(), acked: false };
    entrains.set(m.id, live);
    try {
      var res = await postFrames("/entrain" + peerSuffix(peer), [entrainDoc(point)], live.ctrl.signal);
      for await (var doc of readFrames(res.body)) {
        var g = graphIndex(parseTurtle(doc));
        var subs = envelopeSubjects(g);
        for (var k = 0; k < subs.length; k++) {
          var sub = subs[k], s = sub.s;
          if (sub.cls === "Done") {
            if (!live.acked) { live.acked = true; post({ t: "entrained", id: m.id }); }
            else post({ t: "damped", id: m.id });
          } else if (sub.cls === "Vibration") {
            post({ t: "vibration", id: m.id,
                   seq: intLit(g, s, R + "seq"), at: litOf(g, s, R + "at") });
          } else if (sub.cls === "Denied") {
            post({ t: "damped", id: m.id, reason: "auth-denied: " + (litOf(g, s, R + "reason") || "") });
          } else if (sub.cls === "Error") {
            post({ t: "damped", id: m.id,
                   reason: (litOf(g, s, R + "code") || "error") + ": " + (litOf(g, s, R + "reason") || "") });
          }
        }
      }
      if (live.acked) post({ t: "damped", id: m.id });
    } catch (err) {
      if (err.name !== "AbortError" && err.message !== "unauthorized") {
        post({ t: "damped", id: m.id, reason: "protocol-error: " + err.message });
      }
    } finally {
      entrains.delete(m.id);
    }
  }

  /* the media lane (hologram-protocol.md 5/6): mod "media" on the pinned
     peer, per-source policy gating server-side; raw bytes relayed to the
     guest as transferable ArrayBuffers */
  function postMediaChunk(id, bytes) {
    var buf = (bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength)
      ? bytes.buffer : bytes.slice().buffer;
    if (iframe.contentWindow) {
      iframe.contentWindow.postMessage({ hg: 1, m: { t: "media-data", id: id, chunk: buf } }, "*", [buf]);
    }
  }
  async function guestMedia(m) {
    var ctrl = new AbortController();
    medias.set(m.id, ctrl);
    try {
      var res = await postFrames("/request" + peerSuffix(peer),
        [reqDoc("Query", "media", String(m.signal), null)], ctrl.signal);
      var hdr = await readMediaHeader(res.body);
      if (hdr.denied !== null) {
        post({ t: "media-error", id: m.id, error: { code: "auth-denied", reason: hdr.denied } });
        return;
      }
      if (hdr.error) { post({ t: "media-error", id: m.id, error: hdr.error }); return; }
      if (hdr.contentType === null) {
        post({ t: "media-error", id: m.id,
               error: { code: "protocol-error", reason: "response carried no rsntr:Media header" } });
        return;
      }
      post({ t: "media-header", id: m.id, contentType: hdr.contentType });
      if (hdr.rest && hdr.rest.length) postMediaChunk(m.id, hdr.rest);
      for (;;) {
        var r = await hdr.reader.read();
        if (r.value && r.value.length) postMediaChunk(m.id, r.value);
        if (r.done) break;
      }
      post({ t: "media-end", id: m.id });
    } catch (err) {
      if (err.name === "AbortError") post({ t: "media-end", id: m.id });
      else if (err.message === "unauthorized") {
        post({ t: "media-error", id: m.id, error: { code: "auth-denied", reason: "web session expired" } });
      } else {
        post({ t: "media-error", id: m.id, error: { code: "protocol-error", reason: err.message } });
      }
    } finally {
      medias.delete(m.id);
    }
  }

  /* the audio-duplex lane (hologram-protocol.md 5/6): the microphone is
     a BROKER capability - the opaque-origin guest cannot obtain mic
     permission and never touches audio devices. The guest only starts
     and stops a session; capture, encoding (big-endian L16 per the
     header's accepts rate), and the serialized /duplex/{id} POSTs all
     happen here, pinned to the serving peer. */
  function postDuplexChunk(id, bytes) {
    var buf = (bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength)
      ? bytes.buffer : bytes.slice().buffer;
    if (iframe.contentWindow) {
      iframe.contentWindow.postMessage({ hg: 1, m: { t: "duplex-data", id: id, chunk: buf } }, "*", [buf]);
    }
  }
  var CAPTURE_WORKLET =
    'class RsntrCapture extends AudioWorkletProcessor {\n' +
    '  constructor(options) { super();\n' +
    '    this.outRate = (options.processorOptions && options.processorOptions.outRate) || 8000;\n' +
    '    this.phase = 0; this.prev = 0;\n' +
    '    this.out = new Int16Array(Math.round(this.outRate / 5)); this.outLen = 0; }\n' +
    '  process(inputs) {\n' +
    '    var chans = inputs[0];\n' +
    '    if (!chans || !chans[0]) return true;\n' +
    '    var mono = chans[0];\n' +
    '    if (chans.length > 1) {\n' +
    '      mono = new Float32Array(chans[0].length);\n' +
    '      for (var i = 0; i < mono.length; i++) {\n' +
    '        var sum = 0;\n' +
    '        for (var c = 0; c < chans.length; c++) sum += chans[c][i];\n' +
    '        mono[i] = sum / chans.length;\n' +
    '      }\n' +
    '    }\n' +
    '    var step = sampleRate / this.outRate;\n' +
    '    while (this.phase < mono.length) {\n' +
    '      var idx = Math.floor(this.phase), frac = this.phase - idx;\n' +
    '      var a = idx === 0 ? this.prev : mono[idx - 1];\n' +
    '      var b = mono[idx] !== undefined ? mono[idx] : a;\n' +
    '      var s = a + (b - a) * frac;\n' +
    '      if (s > 1) s = 1; else if (s < -1) s = -1;\n' +
    '      this.out[this.outLen++] = s < 0 ? s * 32768 : s * 32767;\n' +
    '      if (this.outLen === this.out.length) {\n' +
    '        var full = this.out;\n' +
    '        this.out = new Int16Array(full.length); this.outLen = 0;\n' +
    '        this.port.postMessage(full.buffer, [full.buffer]);\n' +
    '      }\n' +
    '      this.phase += step;\n' +
    '    }\n' +
    '    this.phase -= mono.length;\n' +
    '    this.prev = mono[mono.length - 1];\n' +
    '    return true;\n' +
    '  }\n' +
    '}\n' +
    'registerProcessor("rsntr-capture", RsntrCapture);\n';

  async function startMic(dx, accepts, guestId) {
    var rate = 8000;
    var rm = /rate=(\d+)/.exec(accepts || "");
    if (rm) rate = parseInt(rm[1], 10);
    dx.tracks = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true
    } });
    dx.ac = new AudioContext();
    if (dx.ac.state === "suspended") { try { await dx.ac.resume(); } catch (e) { /* gesture policy */ } }
    var srcNode = dx.ac.createMediaStreamSource(dx.tracks);
    var worklet = null;
    if (dx.ac.audioWorklet) {
      var url = URL.createObjectURL(new Blob([CAPTURE_WORKLET], { type: "text/javascript" }));
      try {
        await dx.ac.audioWorklet.addModule(url);
        worklet = new AudioWorkletNode(dx.ac, "rsntr-capture", { processorOptions: { outRate: rate } });
      } catch (e) {
        worklet = null;  /* fall back below rather than lose the call */
      } finally { URL.revokeObjectURL(url); }
    }
    if (!worklet) {
      /* Older engines (and any browser that refuses a Blob worklet)
         still capture through the deprecated ScriptProcessor: a silent
         call is a worse outcome than a deprecated node. */
      var spn = dx.ac.createScriptProcessor(4096, 1, 1);
      var phase = 0, prev = 0;
      spn.onaudioprocess = function (ev) {
        var input = ev.inputBuffer.getChannelData(0);
        var step = dx.ac.sampleRate / rate;
        var out = [];
        while (phase < input.length) {
          var idx = Math.floor(phase), frac = phase - idx;
          var a = idx === 0 ? prev : input[idx - 1];
          var b = input[idx] !== undefined ? input[idx] : a;
          var v = a + (b - a) * frac;
          if (v > 1) v = 1; else if (v < -1) v = -1;
          out.push(v < 0 ? v * 32768 : v * 32767);
          phase += step;
        }
        phase -= input.length;
        prev = input[input.length - 1];
        if (out.length) dx.node.port.onmessage({ data: new Int16Array(out).buffer });
      };
      dx.node = { port: { onmessage: null }, disconnect: function () { spn.disconnect(); } };
      srcNode.connect(spn);
      dx.capture = spn;
      dx.fallback = true;
    } else {
      dx.node = worklet;
      dx.capture = worklet;
    }
    dx.node.port.onmessage = function (ev) {
      /* Int16Array buffer from the worklet -> big-endian L16 bytes
         (audio/L16 is big-endian by RFC 3551; the receiving source
         decodes s16be) */
      var samples = new Int16Array(ev.data);
      var be = new Uint8Array(samples.length * 2);
      var view = new DataView(be.buffer);
      var peak = 0;
      for (var i = 0; i < samples.length; i++) {
        view.setInt16(i * 2, samples[i], false);
        var a = samples[i] < 0 ? -samples[i] : samples[i];
        if (a > peak) peak = a;
      }
      if (peak > dx.peak) dx.peak = peak;
      if (dx.queue.length >= 5) dx.queue.shift(); /* stay live, drop oldest */
      dx.queue.push(be);
      pumpUpstream(dx);
    };
    if (!dx.fallback) srcNode.connect(dx.node);
    /* Every engine must actually pull the capture node. Chrome runs a
       worklet with only an input connected; Safari and Firefox render
       only what reaches the destination, and leave an unconnected node
       silent - which looks exactly like a dead microphone. Routing
       through a muted gain satisfies all of them and still produces no
       local echo. */
    dx.sink = dx.ac.createGain();
    dx.sink.gain.value = 0;
    dx.capture.connect(dx.sink);
    dx.sink.connect(dx.ac.destination);
    /* A microphone that is muted, blocked, or pointed at a dead device
       still yields a stream of zeroes, which used to fail invisibly:
       the call looked live while nothing was said. Report the level
       once the mic has had time to speak so the app can say so. */
    dx.levelTimer = setTimeout(function () {
      post({ t: "duplex-level", id: guestId, peak: dx.peak });
    }, 3000);
  }

  async function pumpUpstream(dx) {
    if (dx.posting || !dx.sid || dx.finSent) return;
    dx.posting = true;
    try {
      while (dx.queue.length && !dx.finSent) {
        var parts = dx.queue.splice(0, dx.queue.length);
        var total = 0;
        for (var k = 0; k < parts.length; k++) total += parts[k].length;
        var body = new Uint8Array(total), off = 0;
        for (var j = 0; j < parts.length; j++) { body.set(parts[j], off); off += parts[j].length; }
        /* the ordering contract: one POST in flight, awaited */
        await api("/duplex/" + encodeURIComponent(dx.sid) , {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: body
        });
      }
    } catch (e) { /* the exchange is ending; teardown reports it */ }
    dx.posting = false;
  }

  function stopDuplex(dx) {
    if (!dx || dx.stopped) return;
    dx.stopped = true;
    if (dx.levelTimer) { clearTimeout(dx.levelTimer); dx.levelTimer = null; }
    if (dx.tracks) { dx.tracks.getTracks().forEach(function (t) { t.stop(); }); dx.tracks = null; }
    if (dx.ac) { try { dx.ac.close(); } catch (e) { /* already closed */ } dx.ac = null; }
    if (dx.sid && !dx.finSent) {
      dx.finSent = true;
      /* best-effort clean hangup, then abort the exchange */
      api("/duplex/" + encodeURIComponent(dx.sid), {
        method: "POST",
        headers: { "Rsntr-Fin": "1" },
        body: new Uint8Array(0)
      }).catch(function () { /* session already gone */ }).finally(function () {
        dx.ctrl.abort();
      });
    } else {
      dx.ctrl.abort();
    }
  }

  async function guestDuplex(m) {
    var dx = { ctrl: new AbortController(), queue: [], posting: false,
               sid: null, tracks: null, ac: null, finSent: false, stopped: false,
               peak: 0, levelTimer: null, capture: null, sink: null };
    duplexes.set(m.id, dx);
    try {
      var res = await postFrames("/request" + peerSuffix(peer),
        [reqDoc("Query", "audio-duplex", String(m.signal), null)], dx.ctrl.signal);
      var hdr = await readDuplexHeader(res.body);
      if (hdr.denied !== null) {
        post({ t: "duplex-error", id: m.id, error: { code: "auth-denied", reason: hdr.denied } });
        return;
      }
      if (hdr.error) { post({ t: "duplex-error", id: m.id, error: hdr.error }); return; }
      if (hdr.accepts === null) {
        post({ t: "duplex-error", id: m.id,
               error: { code: "protocol-error", reason: "response carried no rsntr:AudioDuplex header" } });
        return;
      }
      dx.sid = hdr.id;
      try {
        await startMic(dx, hdr.accepts, m.id);
      } catch (micErr) {
        post({ t: "duplex-error", id: m.id,
               error: { code: "engine-error", reason: "microphone: " + micErr.message } });
        return;
      }
      post({ t: "duplex-open", id: m.id, contentType: hdr.contentType, accepts: hdr.accepts });
      /* drain the downstream (relayed to the guest only when the source
         emits; a pure talk sink just holds the body open) */
      if (hdr.rest && hdr.rest.length && hdr.contentType) postDuplexChunk(m.id, hdr.rest);
      for (;;) {
        var r = await hdr.reader.read();
        if (r.value && r.value.length && hdr.contentType) postDuplexChunk(m.id, r.value);
        if (r.done) break;
      }
      post({ t: "duplex-ended", id: m.id });
    } catch (err) {
      if (err.name === "AbortError") post({ t: "duplex-ended", id: m.id });
      else if (err.message === "unauthorized") {
        post({ t: "duplex-error", id: m.id, error: { code: "auth-denied", reason: "web session expired" } });
      } else {
        post({ t: "duplex-error", id: m.id, error: { code: "protocol-error", reason: err.message } });
      }
    } finally {
      stopDuplex(dx);
      duplexes.delete(m.id);
    }
  }

  function onMsg(e) {
    if (e.source !== iframe.contentWindow) return;
    var d = e.data;
    if (!d || d.hg !== 1 || !d.m) return;
    var m = d.m;
    if (m.t === "ready") { post({ t: "init", peer: peer || "", mod: mod }); return; }
    if (m.t === "query" || m.t === "execute") {
      if (typeof m.id !== "number" || typeof m.signal !== "string") {
        if (typeof m.id === "number") postErr(m.id, "protocol-error", "malformed request message");
        return;
      }
      guestRequest(m);
      return;
    }
    if (m.t === "entrain") {
      if (typeof m.id !== "number" || typeof m.point !== "string") return;
      guestEntrain(m);
      return;
    }
    if (m.t === "damp") {
      var live = entrains.get(m.id);
      if (live) live.ctrl.abort();
      return;
    }
    if (m.t === "media") {
      if (typeof m.id !== "number" || typeof m.signal !== "string") return;
      guestMedia(m);
      return;
    }
    if (m.t === "media-stop") {
      var mc = medias.get(m.id);
      if (mc) mc.abort();
      return;
    }
    if (m.t === "duplex") {
      if (typeof m.id !== "number" || typeof m.signal !== "string") return;
      guestDuplex(m);
      return;
    }
    if (m.t === "duplex-stop") {
      stopDuplex(duplexes.get(m.id));
      return;
    }
    if (typeof m.id === "number") postErr(m.id, "protocol-error", "unknown message type");
  }

  window.addEventListener("message", onMsg);
  iframe.srcdoc = html;
  box.appendChild(iframe);

  var holo = {
    teardown: function () {
      window.removeEventListener("message", onMsg);
      reqCtrls.forEach(function (c) { c.abort(); });
      entrains.forEach(function (l) { l.ctrl.abort(); });
      medias.forEach(function (c) { c.abort(); });
      duplexes.forEach(function (dx) { stopDuplex(dx); });
      iframe.remove();
      if (tab.pane) tab.pane.classList.remove("holo-on");
      if (tab.holo === holo) tab.holo = null;
      tab.holoMod = null;
      syncUrl();
    }
  };
  box.querySelector(".t-close").addEventListener("click", function () {
    holo.teardown();
    container.innerHTML = "";
  });
  box.querySelector(".t-permalink").addEventListener("click", function (ev) {
    copyLinkTo(ev.target);
  });
  tab.holo = holo;
  tab.holoMod = mod;
  syncUrl();
  return holo;
}
/* ---- chat panel ---------------------------------------------------- */
/* Chat rides the four public verbs (chat-protocol.md): the send box is an
   rsntr:Execute mod "chat" through POST /request, history is a re-read of
   the urn:rsntr:chat:history Radiant (same signal, mod, params as the
   scaffold point), live updates entrain urn:rsntr:chat-inbox. */
var CHAT_INBOX_POINT = "urn:rsntr:chat-inbox";
var PENDING_INBOX_POINT = "urn:rsntr:inbox";
var CHAT_ROOM_PREFIX = "urn:rsntr:room:";
var CHAT_BODY_MAX = 65536;
/* the history Radiant's signal, verbatim from the rsntr chat init scaffold */
var CHAT_HISTORY_SQL =
  "SELECT id, scope, sender, at, body, blob_hash, blob_name" +
  " FROM chat_messages" +
  " WHERE (?1 IS NULL OR scope = ?1)" +
  " ORDER BY received_at DESC, id DESC LIMIT ?2";

/* one rsntr:Message as a self-contained Turtle signal (ttlStr escapes) */
function chatMessageDoc(msgId, body, roomIri, atIso) {

async function sendChat(tab) {

  var textEl = tab.pane.querySelector(".t-text");
  var body = textEl.value;

    return;
  }
  var me = state.meta ? state.meta.node_id : null;
  var target = conv.kind === "room" ? conv.host : conv.scope;
  if (!target) { paneStatus(tab, "room host unknown; cannot address the send", "warn"); return; }
  var id = ulid();
  var at = new Date().toISOString().slice(0, 19);

  var localHost = me !== null && target === me;

    /* local append first, as chat send does; INSERT OR IGNORE keeps retries clean */

      "INSERT OR IGNORE INTO chat_messages (id, scope, sender, at, body, outgoing)" +
      " VALUES (?1, ?2, ?3, ?4, ?5, 1)",
      [id, conv.scope, me, at, body]);

         and delivery is one _outbox row per member (chat-protocol 5.3) */

      var mj = await chatSql(
        "SELECT member FROM chat_members WHERE room_id = ?1 AND member != ?2",
        [conv.scope, me]);

      for (var mi = 0; mi < members.length; mi++) {
        await chatSql(
          "INSERT INTO _outbox (request_id, peer, mod, signal) VALUES (?1, ?2, 'chat', ?3)",
          [ulid(), members[mi][0], fanTtl]);

      textEl.value = "";

    var res = await collectResponse(readFrames(httpRes.body));

        "INSERT OR IGNORE INTO _outbox (request_id, peer, mod, signal)" +
        " VALUES (?1, ?2, 'chat', ?3)",

    } else {
      var bad = outcomeStatus(res);
      if (bad) { paneStatus(tab, bad.text, bad.kind); return; }
      var n = res.done ? res.done.affectedRows : null;
      paneStatus(tab, n === 0 ? "sent (recipient already had it)" : "sent", "ok");

  }
}

    for await (var doc of readFrames(res.body)) {
      var g = graphIndex(parseTurtle(doc));
      var subs = envelopeSubjects(g);
      for (var k = 0; k < subs.length; k++) {
        var sub = subs[k];

function ensureAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!state.notif.audio) {
    try { state.notif.audio = new AC(); } catch (e) { return null; }

  var t0 = ctx.currentTime;

    var o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = "sine";

    gn.gain.linearRampToValueAtTime(0.18, s + 0.015);
    gn.gain.exponentialRampToValueAtTime(0.0001, s + 0.16);
    o.connect(gn);
    gn.connect(ctx.destination);

          tab.cleanup = function () { if (tab.holo) { tab.holo.teardown(); tab.holo = null; } };
        } else {
          out.innerHTML = '<pre class="out">' +
            esc(res.generic.map(function (x) { return x.doc; }).join("\n\n")) + "</pre>";
        }
      }
      var d = res.done || {};
      var bits = [];
      if (d.rowCount !== null && d.rowCount !== undefined) bits.push(d.rowCount + " row(s)");
      if (d.affectedRows !== null && d.affectedRows !== undefined) bits.push("affected " + d.affectedRows);
      status("done" + (bits.length ? ": " + bits.join(", ") : ""), "ok");
    } catch (err) {
      if (err.message !== "unauthorized") status("request failed: " + err.message, "err");
    }
  };
  host.querySelector(".mr-run").addEventListener("click", run);
  host.querySelector(".mr-signal").addEventListener("keydown", function (e) {
    if (e.key === "Enter") run();
  });
  host.querySelector(".mr-signal").focus();
}
state.knocks = { rows: [], seen: {}, timer: null };

async function syncKnocks() {
  try {
    var j = await chatSql(
      "SELECT request_id, peer, params, received_at FROM _inbox \
       WHERE decision IS NULL AND (sql IS NULL OR sql = '') \

    rows.forEach(function (r) { state.knocks.seen[r.id] = true; });

async function answerPending(row, allow, grants) {

    if (grants && grants.length) body.grants = grants;

async function pendingOnce() {
  var ctrl = new AbortController();
  state.pending.ctrl = ctrl;
  var res = await postFrames("/entrain", [entrainDoc(PENDING_INBOX_POINT)], ctrl.signal);
  for await (var doc of readFrames(res.body)) {
    var g = graphIndex(parseTurtle(doc));
    var subs = envelopeSubjects(g);
    for (var k = 0; k < subs.length; k++) {
      var sub = subs[k];
      if (sub.cls === "Done") { state.pending.backoff = INBOX_BACKOFF_MIN; await syncPending(); }
      else if (sub.cls === "Vibration") { await syncPending(); }
      else if (sub.cls === "Denied" || sub.cls === "Error") {
        throw new Error("pending entrain " + sub.cls);
      }
    }

async function pendingLoop() {
  if (state.pending.running) return;
  state.pending.running = true;
  for (;;) {
    try { await pendingOnce(); }
    catch (err) {
      if (err.message === "unauthorized") { state.pending.running = false; return; }
    }
    await sleep(state.pending.backoff);
    state.pending.backoff = nextBackoff(state.pending.backoff);
  }
}

        [r.peer, "admitted via inbox " + r.id]);

/* ---- small helpers ------------------------------------------------- */
function loadTheme() {
  try { return typeof localStorage !== "undefined" ? (localStorage.getItem("rsntr_theme") || null) : null; }
  catch (e) { return null; }
}
function applyTheme() {
  if (state.theme === "dark" || state.theme === "light") {
    document.documentElement.setAttribute("data-theme", state.theme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
function cycleTheme() {
  state.theme = state.theme === null ? "dark" : state.theme === "dark" ? "light" : null;
  try {
    if (state.theme) localStorage.setItem("rsntr_theme", state.theme);
    else localStorage.removeItem("rsntr_theme");
  } catch (e) { /* private mode */ }
  applyTheme();
}
function nowIso() { return new Date().toISOString(); }
function shortHex(h) {
  h = String(h || "");
  return h.length > 16 ? h.slice(0, 8) + "…" + h.slice(-4) : h;
}
/* sqlite's datetime('now') has no T and no Z; treat naked stamps as UTC */
function parseWhen(s) {
  if (!s) return null;
  s = String(s);
  if (s.indexOf("T") < 0) s = s.replace(" ", "T");
  if (!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s += "Z";
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtAgo(iso) {
  var d = parseWhen(iso);
  if (!d) return "never";
  var s = (Date.now() - d.getTime()) / 1000;
  if (s < -60) return String(iso).slice(0, 16).replace("T", " ");
  if (s < 50) return "just now";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
/* pixel identicon on the blue token (theme-aware via CSS var), or the
   stored image when the subject has one */
function avatar(seed, big) {
  var img = state.avatars && state.avatars.get(String(seed || ""));
  if (img) {
    return '<span class="avatar' + (big ? " big" : "") + '"><img src="' + img + '" alt=""></span>';
  }
  var h = fnv1a(String(seed || "?"));
  var cells = "";
  for (var col = 0; col < 3; col++) {
    for (var row = 0; row < 5; row++) {
      if ((h >>> (col * 5 + row)) & 1) {
        cells += '<rect x="' + (col + 1) + '" y="' + (row + 1) + '" width="1" height="1"/>';
        if (col < 2) cells += '<rect x="' + (5 - col) + '" y="' + (row + 1) + '" width="1" height="1"/>';
      }
    }
  }
  return '<span class="avatar' + (big ? " big" : "") + '"><svg viewBox="0 0 7 7" shape-rendering="crispEdges" fill="var(--blue)" role="img" aria-hidden="true">' + cells + "</svg></span>";
}
function labelFor(scope) {
  if (scope === "" || (state.meta && scope === state.meta.node_id)) return "this node";
  var l = chatLabelFor(scope);
  return /^[0-9a-f]{60,}/.test(l) ? shortHex(scope) : l;

function inlineEditSval(rowBtn, current, onCommit) {
  var sval = rowBtn.querySelector(".sval");

  rowBtn.dataset.editing = "1";
  sval.innerHTML = '<input type="text" class="sval-input" autocomplete="off" spellcheck="false">';
  var inp = sval.firstChild;

  inp.addEventListener("click", function (e) { e.stopPropagation(); });
}

/* ---- avatars: tiny raw-BLOB images in user space -------------------- */
/* One row per subject (peer endpoint id, room IRI, or this node's id).
   The image is stored as raw bytes (never base64: sqlite BLOBs are the
   native form, base64 only rides the JSON wire as blob_hex), downscaled
   client-side to 128px JPEG so a row stays ~10 KB. */
/* The web sql lane may not run DDL (footprint.rs: owner lane only), so
   the table is bootstrapped through the csv import endpoint, which
   creates tables server-side. Writes are DELETE+INSERT, so the loose
   csv schema (no PK) behaves like one; a node owner can pre-create the
   strict form over the CLI instead:
     rsntr sql <dir> "CREATE TABLE avatars (subject TEXT PRIMARY KEY,
       content_type TEXT NOT NULL, image BLOB NOT NULL,
       updated_at TEXT NOT NULL DEFAULT (datetime('now')))"
   and this code uses it unchanged. */
async function ensureAvatarsTable() {
  if (state.avatarsReady) return;
  if ((state.tables || []).some(function (t) { return t.name === "avatars"; })) {
    state.avatarsReady = true;
    return;
  }
  var res = await api("/api/csv/avatars", {
    method: "POST", headers: { "Content-Type": "text/csv" },
    body: "subject,content_type,image,updated_at\n"
  });
  var j = await res.json();
  if (!j.ok) throw new Error(fmtJsonErr(j).text);
  try {
    await saveTableComment("avatars",
      "small profile images, one per subject (peer id, room IRI, or this node); raw bytes, 128px");
  } catch (e) { /* the table stands; the description can come later */ }
  state.avatarsReady = true;
}
function hexToB64(hex) {
  var bin = "";
  for (var i = 0; i < hex.length; i += 2) bin += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
  return btoa(bin);
}
async function loadAvatars() {
  try {
    var j = await chatSql("SELECT subject, content_type, image FROM avatars");
    var m = new Map();
    (j.rows || []).forEach(function (r) {
      if (r[2] && r[2].blob_hex) {
        m.set(r[0], "data:" + (r[1] || "image/jpeg") + ";base64," + hexToB64(r[2].blob_hex));
      }
    });
    state.avatars = m;
  } catch (e) { /* table absent until the first avatar is set */ }
}
/* file -> 128px cover-cropped JPEG hex */
function downscaleToHex(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var S = 128;
        var cv = document.createElement("canvas");
        cv.width = S; cv.height = S;
        var ctx = cv.getContext("2d");
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        var dataUrl = cv.toDataURL("image/jpeg", 0.85);
        var b64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
        var bin = atob(b64), hex = "";
        for (var i = 0; i < bin.length; i++) {
          hex += ("0" + bin.charCodeAt(i).toString(16)).slice(-2);
        }
        URL.revokeObjectURL(url);
        resolve(hex);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("not a readable image")); };
    img.src = url;
  });
}
async function saveAvatarHex(subject, hex) {
  await ensureAvatarsTable();
  await chatSql("DELETE FROM avatars WHERE subject = ?1", [subject]);
  await chatSql("INSERT INTO avatars (subject, content_type, image, updated_at) " +
    "VALUES (?1, 'image/jpeg', ?2, datetime('now'))", [subject, { blob_hex: hex }]);
  await loadAvatars();
  renderContacts();
  rerenderType("node");
  rerenderType("chatinfo");
}

    '<button class="srow" id="av-reset"><div class="srow-main"><span class="slabel">back to the identicon</span>' +

var toastTimer = null;
function toast(text, actLabel, act) {
  var t = $("toast");
  t.innerHTML = "<span>" + esc(text) + "</span>" + (actLabel ? '<button class="toast-act" id="toast-act">' + esc(actLabel) + "</button>" : "");
  t.classList.add("show");
  if (actLabel) $("toast-act").onclick = function () { t.classList.remove("show"); if (act) act(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3500);
}
function openSheet(html) {
  $("sheet-body").innerHTML = html;
  $("sheet").classList.add("show");
  $("scrim").classList.add("show");
}
function closeSheet() {

  $("sheet").classList.remove("show");

}
function confirmBox(text, doLabel, act) {
  var c = $("confirm");
  c.innerHTML = "<p>" + esc(text) + '</p><button class="do-it" id="cf-do">' + esc(doLabel) +
    '</button><button id="cf-no">keep it</button>';
  c.classList.add("show");
  $("scrim").classList.add("show");

}

/* The in-page stand-in for window.prompt: a WKWebView shell without a
   WKUIDelegate text-input panel returns null from the native one without
   ever showing it, so the console never calls it. `act(value)` runs on
   confirm with the trimmed value; cancel runs nothing. Empty is refused
   unless `allowEmpty` (clearing a field is an edit, not a cancel). */
function promptBox(text, initial, doLabel, act, allowEmpty) {
  var c = $("confirm");
  c.innerHTML = "<p>" + esc(text) + '</p><input id="cf-in" type="text" spellcheck="false">' +
    '<button class="do-it" id="cf-do">' + esc(doLabel) + '</button><button id="cf-no">cancel</button>';
  c.classList.add("show");
  $("scrim").classList.add("show");
  var input = $("cf-in");
  input.value = initial === null || initial === undefined ? "" : String(initial);
  function close() { c.classList.remove("show"); $("scrim").classList.remove("show"); }
  function commit() {
    var v = input.value.trim();
    if (!v && !allowEmpty) return;
    close();
    act(v);
  }
  $("cf-do").onclick = commit;
  $("cf-no").onclick = close;
  input.onkeydown = function (e) {
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
  };
  input.focus();
  input.select();
}

/* ---- screen stack framework ---------------------------------------- */
function curStack() { return state.nav.stacks[state.nav.tab]; }
function topScreen() { var s = curStack(); return s.length ? s[s.length - 1] : null; }
function allScreens() {
  var out = [];
  ["peers", "feed", "node"].forEach(function (t) {
    state.nav.stacks[t].forEach(function (sc) { out.push(sc); });
  });
  return out;
}
function destroyScreen(sc) {
  if (sc.cleanup) { try { sc.cleanup(); } catch (e) { /* teardown is best-effort */ } }
  if (sc.el) sc.el.remove();
}
function pushScreen(spec) {
  var el = document.createElement("section");
  el.className = "screen screen-" + spec.t;
  spec.el = el;
  $("screens").appendChild(el);
  curStack().push(spec);
  buildScreen(spec);
  showTop();
  return spec;
}
function popScreen() {
  var s = curStack();
  if (s.length <= 1) return;
  destroyScreen(s.pop());
  showTop();
}
function popToRoot(tab) {
  var s = state.nav.stacks[tab];
  while (s.length > 1) destroyScreen(s.pop());
}
function setTab(tab) {
  if (state.nav.tab === tab) popToRoot(tab);
  if (state.nav.tab === "feed" && tab !== "feed") state.feedSeen = nowIso();
  state.nav.tab = tab;
  showTop();
  if (tab === "feed") {
    /* render once with the old watermark so "new" edges show, then
       everything up to now counts as seen */
    state.feedSeen = nowIso();
    updateTabbar();
  }
}
function showTop() {
  ["peers", "feed", "node"].forEach(function (t) {
    var stack = state.nav.stacks[t];
    stack.forEach(function (sc, i) {
      sc.el.classList.toggle("active", t === state.nav.tab && i === stack.length - 1);
    });
  });
  updateTabbar();
  syncUrl();
  window.scrollTo(0, 0);
}
function buildScreen(sc) {
  if (sc.t === "peers") buildPeersScreen(sc);
  else if (sc.t === "feed") buildFeedScreen(sc);
  else if (sc.t === "node") buildNodeScreen(sc);
  else if (sc.t === "profile") buildProfileScreen(sc);
  else if (sc.t === "chat") buildChatScreen(sc);
  else if (sc.t === "chatinfo") buildChatInfoScreen(sc);
  else if (sc.t === "proj") buildProjScreen(sc);
  else if (sc.t === "point") buildPointScreen(sc);
  else if (sc.t === "app") buildAppScreen(sc);
  else if (sc.t === "knock") buildKnockScreen(sc);
  else if (sc.t === "table") buildTableScreen(sc);
  else if (sc.t === "console") buildConsoleScreen(sc);
  else if (sc.t === "modrun") buildModrunScreen(sc);
}
function rerenderType(t) {

function openFeed() {
  if (state.feed) { state.feed.close(); state.feed = null; }
  var es;
  try { es = new EventSource("/feed"); }
  catch (e) { state.health.feed = "unavailable"; updateAlarm(); return; }
  state.feed = es;
  es.onopen = function () { state.health.feed = "open"; updateAlarm(); };
  es.onerror = function () { state.health.feed = "reconnecting"; updateAlarm(); };
  es.addEventListener("envelope", function (ev) {
    try {
      var g = graphIndex(parseTurtle(ev.data));
      var subs = envelopeSubjects(g);
      var vib = subs.find(function (x) { return x.cls === "Vibration"; });
      if (vib) {
        var pointT = obj1(g, vib.s, R + "point");
        var point = pointT && pointT.t === "iri" ? pointT.v : "?";
        if (point === "urn:rsntr:projection-changed") {
          addFeed({ kind: "system", text: "this node's projection changed", ttl: ev.data });
          rerenderType("proj");
        } else {
          addFeed({ kind: "ping", peer: null, point: point, label: point,
                    seq: litOf(g, vib.s, R + "seq"), ttl: ev.data });
        }
      } else {
        var names = subs.map(function (x) { return x.cls; }).join(", ");
        addFeed({ kind: "rdf", text: names || "envelope", ttl: ev.data });
      }
    } catch (e) {
      addFeed({ kind: "rdf", text: "envelope (unparsed)", ttl: ev.data });
    }

}

/* ---- watches: global entrainments that outlive their screen --------- */
function watchKey(peer, iri) { return (peer || "") + "|" + iri; }
function isWatching(peer, iri) { return state.watches.has(watchKey(peer, iri)); }
async function startWatch(peer, pt) {
  if (!pt.iri) { toast("this signal has no point IRI"); return; }
  var key = watchKey(peer, pt.iri);
  if (state.watches.has(key)) return;
  var w = { ctrl: new AbortController(), peer: peer, iri: pt.iri, label: pt.label, live: false };
  state.watches.set(key, w);
  rerenderType("point"); rerenderType("proj"); rerenderType("profile");
  try {
    var res = await postFrames("/entrain" + peerSuffix(peer), [entrainDoc(pt.iri)], w.ctrl.signal);
    for await (var doc of readFrames(res.body)) {
      var g = graphIndex(parseTurtle(doc));
      var subs = envelopeSubjects(g);
      for (var k = 0; k < subs.length; k++) {
        var sub = subs[k];
        if (sub.cls === "Done") {
          if (!w.live) {
            w.live = true;
            addFeed({ kind: "system", text: "watching " + pt.label + (peer ? " at " + labelFor(peer) : "") });
            rerenderType("point");
          }
        } else if (sub.cls === "Vibration") {
          addFeed({ kind: "ping", peer: peer || null, point: pt.iri, label: pt.label,
                    seq: litOf(g, sub.s, R + "seq"), ttl: doc });
          rerenderType("point");
        } else if (sub.cls === "Denied") {
          addFeed({ kind: "system", text: "watch denied: " + (litOf(g, sub.s, R + "reason") || pt.label) });
        } else if (sub.cls === "Error") {
          addFeed({ kind: "system", text: "watch error: " + (litOf(g, sub.s, R + "reason") || pt.label) });
        }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError" && err.message !== "unauthorized") {
      addFeed({ kind: "system", text: "watch ended: " + pt.label + " (" + err.message + ")" });
    }
  } finally {
    state.watches.delete(key);
    rerenderType("point"); rerenderType("proj"); rerenderType("profile");
  }
}
function stopWatch(peer, iri) {
  var w = state.watches.get(watchKey(peer, iri));
  if (w) w.ctrl.abort();
}

/* ---- presence probes ------------------------------------------------ */
var PROBE_TTL = 60000;
async function probePeer(id, force) {
  var p = state.presence.get(id);
  if (p && p.probing) return;
  if (!force && p && Date.now() - p.t < PROBE_TTL) return;
  state.presence.set(id, Object.assign({}, p || {}, { probing: true }));
  renderContacts();
  try {
    var j = await apiJson("/api/peer/" + encodeURIComponent(id));
    var live = j.ok ? j.live : null;
    state.presence.set(id, {
      t: Date.now(), probing: false,
      reachable: !!(live && live.reachable),
      hello: (live && live.reachable) ? live : null,
      err: (live && live.error) || (j.ok ? null : fmtJsonErr(j).text),
      row: j.ok ? j.peer : null
    });
  } catch (e) {
    if (e.message === "unauthorized") return;
    state.presence.set(id, { t: Date.now(), probing: false, reachable: false, err: e.message, row: null });
  }
  renderContacts();
  updateTabbar();
}
function probeAllPeers(force) {

}
function presenceBadge(id) {

}

/* ---- knocking: the one frame a stranger may send -------------------- */
async function knockPeer(peer, message) {
  var doc = "[] a rsntr:Knock ; rsntr:id " + ttlStr(ulid()) +
    " ; rsntr:message " + ttlStr(message) + " .";
  var res = await postFrames("/request" + peerSuffix(peer), [doc]);
  var out = { decision: null, reason: null };
  for await (var d of readFrames(res.body)) {
    var g = graphIndex(parseTurtle(d));
    typedSubjects(g, R + "Decision").forEach(function (s) {
      out.decision = litOf(g, s, R + "decision") || "answered";
      out.reason = litOf(g, s, R + "reason");
    });
    typedSubjects(g, R + "Denied").forEach(function (s) {
      out.decision = "deny";
      out.reason = litOf(g, s, R + "reason");
    });
  }
  return out;
}
/* fire a knock and narrate the outcome; onAllowed runs if they let us in */
function knockAndReport(peer, onAllowed) {
  var me = state.meta ? state.meta.node_id : null;
  var msg = "knock from " + (me ? shortHex(me) : "a new peer") +
    " via the resonator app: added you as a peer, requesting admission.";
  knockPeer(peer, msg).then(function (r) {
    if (r.decision === "allow") {
      toast("they admitted this node" + (r.reason ? ": " + r.reason : ""));
      if (onAllowed) onAllowed();
    } else if (r.decision === "deny") {
      toast("knock denied" + (r.reason ? ": " + r.reason : ""));
    } else {
      toast("knocked; parked for their owner's decision");
    }
  }, function (e) {
    if (e.message !== "unauthorized") toast("knock did not reach them: " + e.message);
  });
}

/* one hosted-room fan-out Message (mirrors chat.rs message_to_turtle:
   rsntr:from, rsntr:room, plus the <room> rsntr:name triple) */
function hostedRoomDoc(msgId, body, roomIri, roomName, fromId, atIso) {
  var d = "[] a rsntr:Message ; rsntr:id " + ttlStr(msgId) +
    " ; rsntr:from " + ttlStr(fromId) +
    " ; rsntr:room <" + roomIri + ">" +
    " ; rsntr:at " + ttlStr(atIso) + "^^xsd:dateTime" +
    " ; rsntr:body " + ttlStr(body) + " .";
  if (roomName) d += "\n<" + roomIri + "> rsntr:name " + ttlStr(roomName) + " .";
  return d;
}

async function fetchPoints(peer, path) {

  var bad = outcomeStatus(res);
  if (bad) throw new Error(bad.text);
  if (!res.projection) throw new Error("no rsntr:Projection in the response");
  var g = res.projection.g;
  var offers = obj1(g, res.projection.s, R + "offers");
  return offers ? listItems(g, offers).map(function (t) { return parsePoint(g, t); }) : [];
}
