# Xcode project for the iOS app, generated by `xcodegen` (build.sh runs it).
name: Resonator
options:
  bundleIdPrefix: am.resonator.client
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${RESONATOR_TEAM}
targets:
  Resonator:
    type: application
    platform: iOS
    sources:
      - path: Resonator
      - path: Generated/ResonatorFFI.swift
    dependencies:
      - framework: Generated/ResonatorFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: am.resonator.client.ios
        PRODUCT_NAME: Resonator
        INFOPLIST_FILE: Resonator/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resonator/Resonator.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        # The node library is built for arm64 only (Apple silicon
        # simulators and devices).
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
