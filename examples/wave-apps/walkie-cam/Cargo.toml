[package]
name = "walkie-cam"
version = "0.1.0"
edition = "2024"
publish = false

# Built on its own for wasm32-wasip2 (see ../README.md), not part of the
# resonator workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
resonator-app-sdk = { path = "../../../crates/resonator-app-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true
