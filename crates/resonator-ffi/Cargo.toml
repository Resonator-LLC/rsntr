[package]
name = "resonator-ffi"
description = "The resonator node for apps: a UniFFI interface (Swift, Kotlin) over resonator-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "resonator_ffi"

[[bin]]
# `cargo run -p resonator-ffi --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
resonator-node = { path = "../resonator-node" }
resonator-server = { path = "../resonator-server" }
thiserror = "2"
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
