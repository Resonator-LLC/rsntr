[package]
name = "resonator-apps"
description = "Wave apps: the wasm component runtime that runs the same app on every node of a wave"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Lets tests and tools build a Pulley (interpreter) engine on any platform;
# iOS always gets it.
pulley = ["wasmtime/pulley"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "ios")'.dependencies]
wasmtime = { version = "50.0.1", default-features = false, features = ["pulley"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
resonator-apps = { path = ".", features = ["pulley"] }
