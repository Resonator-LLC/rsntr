[package]
name = "resonator-federation"
description = "Server-to-server federation for the resonator wave server over iroh: server identity, peer trust, delta signing and the federation wire protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
resonator-model = { path = "../resonator-model" }
resonator-server = { path = "../resonator-server" }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
hickory-resolver = "0.26.3"
async-trait = "0.1"
prost = "0.14"
sha2 = "0.10"
getrandom = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
ulid = { version = "1.2", default-features = false }
bip39 = "2.2"
hkdf = "0.12.4"
zeroize = "1"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Pairing by code: SPAKE2 over the pairing stream, and the pkarr signed
# packets (iroh's own implementation) of the rendezvous record, put to and
# got from a pkarr relay over HTTP.
spake2 = "0.4"
iroh-dns = { version = "1.4.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
