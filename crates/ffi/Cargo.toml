[package]
name = "resonator-ffi"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
name = "resonator_ffi"
# staticlib for the iOS xcframework, cdylib for Android (and for
# uniffi-bindgen's library mode on the host), lib for the Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# The uniffi-bindgen CLI (mobile/build-*.sh); host tooling only.
bindgen = ["uniffi/cli"]
# The loopback web console (axum) for WebView shells (ios/ app).
web = ["rsntr/web", "dep:resonator-web"]

[dependencies]
# No mods (extism/wasmtime) on mobile targets; the web server (axum) is
# opt-in via the `web` feature for apps that show the console in a
# WebView.
rsntr = { path = "../cli", default-features = false }
resonator-web = { path = "../web", optional = true }
resonator-node = { path = "../node" }
resonator-protocol = { path = "../protocol" }
resonator-transport = { path = "../transport" }
anyhow = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
uniffi = { workspace = true }
