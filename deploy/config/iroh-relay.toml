# iroh-relay 1.4.1 behind Caddy. Caddy terminates TLS for rly.rsntr.net
# and proxies the relay's WebSocket to the HTTPS listener here; QUIC
# address discovery is served directly on udp 7842 with the same
# certificate (copied from Caddy by iroh-relay-cert).
enable_relay = true
http_bind_addr = "127.0.0.1:3340"
enable_quic_addr_discovery = true
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"

[tls]
https_bind_addr = "127.0.0.1:3341"
quic_bind_addr = "0.0.0.0:7842"
cert_mode = "Reloading"
manual_cert_path = "/etc/iroh-relay/tls/cert.pem"
manual_key_path = "/etc/iroh-relay/tls/key.pem"

[limits]
accept_conn_limit = 100.0
accept_conn_burst = 300

[limits.client.rx]
bytes_per_second = 4194304
max_burst_bytes = 16777216
